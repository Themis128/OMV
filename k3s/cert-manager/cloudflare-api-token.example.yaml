# Template — copy to cloudflare-api-token.yaml (gitignored), populate, and apply.
#
# Used by the ClusterIssuer Cloudflare DNS-01 solver for cloudless.gr.
# cloudless.gr is served by the k3s cluster via Cloudflare Tunnel and uses
# Cloudflare DNS for ACME DNS-01 challenges.
#
# Required Cloudflare API token permissions (least-privilege):
#   Zone → DNS → Edit   (scoped to the cloudless.gr zone only)
#
# Create at: Cloudflare dashboard → My Profile → API Tokens → Create Token
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "PUT-CLOUDFLARE-API-TOKEN-HERE"

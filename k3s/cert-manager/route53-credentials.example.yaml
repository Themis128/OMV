# Template — copy to route53-credentials.yaml (gitignored), populate, and apply.
# The IAM user behind these creds must have permission to manage TXT records
# in the cloudless.online hosted zone (Z04620301I2V4SU2RF1RV) for ACME DNS-01.
#
# Required IAM policy (least-privilege):
#   - route53:GetChange on *
#   - route53:ChangeResourceRecordSets on the zone ARN
#   - route53:ListHostedZonesByName on *
#
# The ClusterIssuer reads only the secretAccessKey from this Secret;
# accessKeyID is passed in the issuer manifest as plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: route53-credentials
  namespace: cert-manager
type: Opaque
stringData:
  secret-access-key: "PUT-AWS-SECRET-ACCESS-KEY-HERE"

# Template — copy to route53-credentials.yaml (gitignored), populate, and apply.
# Used by the ClusterIssuer Route 53 DNS-01 solver for cloudless.gr (zone
# Z079608614L53CC4EAZM3, SST-managed). cloudless.online uses the Cloudflare
# solver — see cloudflare-api-token.example.yaml.
#
# Required IAM policy (least-privilege):
#   - route53:GetChange on *
#   - route53:ChangeResourceRecordSets on arn:aws:route53:::hostedzone/Z079608614L53CC4EAZM3
#   - route53:ListHostedZonesByName on *
#
# The ClusterIssuer reads both access-key-id and secret-access-key from this
# Secret via accessKeyIDSecretRef and secretAccessKeySecretRef.
apiVersion: v1
kind: Secret
metadata:
  name: route53-credentials
  namespace: cert-manager
type: Opaque
stringData:
  access-key-id: "PUT-AWS-ACCESS-KEY-ID-HERE"
  secret-access-key: "PUT-AWS-SECRET-ACCESS-KEY-HERE"

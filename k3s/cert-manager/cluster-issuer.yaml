apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: tbaltzakis@cloudless.gr
    privateKeySecretRef:
      name: letsencrypt-cloudflare-account
    solvers:
      # cloudless.gr is served by the k3s cluster via Cloudflare Tunnel and
      # uses Cloudflare DNS for ACME DNS-01 challenges. Prerequisite:
      # cloudflare-api-token Secret (see cloudflare-api-token.example.yaml).
      - selector:
          dnsZones:
            - cloudless.gr
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
# Staging issuer — useful for first-time setup so we don't burn LE production rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: tbaltzakis@cloudless.gr
    privateKeySecretRef:
      name: letsencrypt-cloudflare-staging-account
    solvers:
      - selector:
          dnsZones:
            - cloudless.gr
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token

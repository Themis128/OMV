apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-route53
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: tbaltzakis@cloudless.gr
    privateKeySecretRef:
      name: letsencrypt-route53-account
    solvers:
      # cloudless.online is authoritative on Cloudflare DNS — must use the
      # Cloudflare solver.  Prerequisite: cloudflare-api-token Secret
      # (see cloudflare-api-token.example.yaml).
      - selector:
          dnsZones:
            - cloudless.online
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
      # cloudless.gr remains on Route 53 (SST-managed zone Z079608614L53CC4EAZM3).
      - selector:
          dnsZones:
            - cloudless.gr
        dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z079608614L53CC4EAZM3
            accessKeyIDSecretRef:
              name: route53-credentials
              key: access-key-id
            secretAccessKeySecretRef:
              name: route53-credentials
              key: secret-access-key
---
# Staging issuer — useful for first-time setup so we don't burn LE production rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-route53-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: tbaltzakis@cloudless.gr
    privateKeySecretRef:
      name: letsencrypt-route53-staging-account
    solvers:
      - selector:
          dnsZones:
            - cloudless.online
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
      - selector:
          dnsZones:
            - cloudless.gr
        dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z079608614L53CC4EAZM3
            accessKeyIDSecretRef:
              name: route53-credentials
              key: access-key-id
            secretAccessKeySecretRef:
              name: route53-credentials
              key: secret-access-key

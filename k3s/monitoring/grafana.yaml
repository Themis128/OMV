---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# Prometheus + Loki datasources auto-provisioned on startup.
# If Prometheus URL returns "connection refused", update to match your service:
#   kubectl get svc -n monitoring | grep prometheus
# Common names: prometheus-operated:9090, prometheus-server:80,
#               prometheus-kube-prometheus-prometheus:9090
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-operated.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 30s
          httpMethod: POST
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: cluster
        orgId: 1
        folder: Cluster
        type: file
        disableDeletion: false
        updateIntervalSeconds: 60
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  pod-overview.json: |
    {
      "title": "Pod Overview",
      "uid": "pod-overview",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Pod CPU Usage % of Limit",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (namespace, pod, container) (\n  rate(container_cpu_usage_seconds_total{container!=\"\", container!=\"POD\"}[5m])\n) / sum by (namespace, pod, container) (\n  kube_pod_container_resource_limits{resource=\"cpu\", container!=\"\"}\n) * 100",
            "legendFormat": "{{namespace}}/{{pod}}/{{container}}"
          }]
        },
        {
          "id": 2,
          "title": "Pod Memory Usage % of Limit",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (namespace, pod, container) (\n  container_memory_working_set_bytes{container!=\"\", container!=\"POD\"}\n) / sum by (namespace, pod, container) (\n  kube_pod_container_resource_limits{resource=\"memory\", container!=\"\"}\n) * 100",
            "legendFormat": "{{namespace}}/{{pod}}/{{container}}"
          }]
        },
        {
          "id": 3,
          "title": "Pod Restart Count (total)",
          "type": "stat",
          "gridPos": {"x": 0, "y": 8, "w": 8, "h": 6},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (namespace, pod, container) (kube_pod_container_status_restarts_total)",
            "legendFormat": "{{namespace}}/{{pod}}"
          }]
        },
        {
          "id": 4,
          "title": "Pod Phase",
          "type": "table",
          "gridPos": {"x": 8, "y": 8, "w": 16, "h": 6},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "kube_pod_status_phase",
            "instant": true,
            "legendFormat": "{{namespace}} / {{pod}} — {{phase}}"
          }]
        },
        {
          "id": 5,
          "title": "HPA Current vs Desired Replicas",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 14, "w": 12, "h": 7},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "kube_horizontalpodautoscaler_status_current_replicas",
              "legendFormat": "current — {{namespace}}/{{horizontalpodautoscaler}}"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas",
              "legendFormat": "max — {{namespace}}/{{horizontalpodautoscaler}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Node Memory Available",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 14, "w": 12, "h": 7},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "node_memory_MemAvailable_bytes / 1024 / 1024",
            "legendFormat": "{{instance}} MB free"
          }]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
      - name: grafana
        image: grafana/grafana:11.3.0
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
              optional: true
        - name: GF_SERVER_ROOT_URL
          value: "https://grafana.cloudless.gr"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: "false"
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: "false"
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 80
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: grafana.cloudless.gr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              name: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv
      containers:
      - name: ntfy
        image: binwiederhier/ntfy:v2.37.2
        args:
        - serve
        - --listen-http
        - :80
        - --attachment-cache-dir=/var/cache/ntfy
        - --base-url=https://ntfy.cloudless.gr
        - --enable-metrics
        env:
        - name: NTFY_FILES_BASE_URL
          value: https://ntfy.cloudless.gr/files
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /var/cache/ntfy
          name: data
        - mountPath: /etc/ntfy
          name: config
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ntfy-data
      - name: config
        configMap:
          name: ntfy-config

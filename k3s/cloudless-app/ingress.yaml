# Traefik (k3s default) Ingress for cloudless.online.
# TLS is issued by cert-manager via the cluster-issuer-route53 ClusterIssuer
# (Let's Encrypt DNS-01 over Route 53).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudless-app
  namespace: cloudless
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-route53
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cloudless.online
      secretName: cloudless-online-tls
  rules:
    - host: cloudless.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudless-app
                port:
                  name: http

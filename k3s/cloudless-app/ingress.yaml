# Traefik Ingress for cloudless.gr.
#
# TLS layout:
#   * Public (browser ↔ Cloudflare) — Cloudflare Universal SSL, automatic.
#   * Origin (cloudflared ↔ Traefik) — Traefik's default self-signed cert;
#     the tunnel uses `noTLSVerify: true` so a real cert is not required.
#
# pi-origin.cloudless.gr is the tunnel backend hostname used by the Cloudflare
# Worker failover proxy — requests arrive with that Host header and need to
# route to the same backend as cloudless.gr.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudless-app
  namespace: cloudless
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: cloudless-cloudless-app-ratelimit@kubernetescrd,cloudless-cloudless-app-inflight@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: cloudless.gr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudless-app
                port:
                  name: http
    - host: pi-origin.cloudless.gr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudless-app
                port:
                  name: http

# Traefik Ingress for cloudless.gr.
#
# TLS layout:
#   * Public (browser ↔ Cloudflare) — Cloudflare Universal SSL, automatic.
#   * Origin (cloudflared ↔ Traefik) — Traefik's default self-signed cert;
#     the tunnel uses `noTLSVerify: true` so a real cert is not required.
#
# No cert-manager, no Let's Encrypt, no Cloudflare API token needed on the
# cluster. If you ever bypass the tunnel (direct LAN TLS to Traefik), add a
# real cert here and re-enable the cert-manager annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudless-app
  namespace: cloudless
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Shed excess load gracefully (429) when the Pi hits its limit.
    traefik.ingress.kubernetes.io/router.middlewares: cloudless-cloudless-app-ratelimit@kubernetescrd,cloudless-cloudless-app-inflight@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: cloudless.gr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudless-app
                port:
                  name: http

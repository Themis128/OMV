# Webhook receiver for image-sync / config-sync triggers.
#
# Ingress path:
#   internet → Tailscale Funnel (omv.tail8eb71.ts.net) → Pi Traefik :18443
#            → IngressRoute /_sync/* → Service sync-webhook:8080 → Deployment
#
# The receiver runs the Python script from a ConfigMap; the alpine/k8s base
# image already has python3 + kubectl. No custom image required.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sync-webhook
  namespace: cloudless
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sync-webhook
  namespace: cloudless
rules:
  # Read CronJob templates so `kubectl create job --from=cronjob/...` works.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["image-sync", "config-sync"]
    verbs: ["get"]
  # Create + observe one-off Jobs derived from those CronJobs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sync-webhook
  namespace: cloudless
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sync-webhook
subjects:
  - kind: ServiceAccount
    name: sync-webhook
    namespace: cloudless
---
apiVersion: v1
kind: Service
metadata:
  name: sync-webhook
  namespace: cloudless
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sync-webhook
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-webhook
  namespace: cloudless
  labels:
    app.kubernetes.io/name: sync-webhook
    app.kubernetes.io/component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sync-webhook
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sync-webhook
      annotations:
        # Roll the pod when the script changes (kustomize will hash the CM
        # and inject; this annotation triggers re-deploy on script edits).
        cloudless.gr/script-version: "v1"
    spec:
      serviceAccountName: sync-webhook
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: webhook
          image: alpine/k8s:1.30.0
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/sync-webhook.py"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NAMESPACE
              value: "cloudless"
            - name: TS_WINDOW_SEC
              value: "300"
            - name: PORT
              value: "8080"
            - name: SYNC_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudless-app-config
                  key: SYNC_HMAC_SECRET
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests: { cpu: "20m", memory: "48Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
      volumes:
        - name: script
          configMap:
            name: sync-webhook-script
            defaultMode: 0o555
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
# IngressRoute that grabs /_sync/* before the cloudless-app catch-all rule.
# Higher priority (1000) ensures it matches first regardless of Host header
# (the path is the only allowlist; HMAC is the actual auth).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sync-webhook
  namespace: cloudless
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: PathPrefix(`/_sync/`)
      priority: 1000
      kind: Rule
      services:
        - name: sync-webhook
          port: 8080

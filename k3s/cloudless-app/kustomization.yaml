apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudless
resources:
  - namespace.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - service.yaml
# NOTE: app-config (Secret) is intentionally NOT listed — it's populated
# out-of-band. Live env comes from configMap `cloudless-app-config` +
# secret `cloudless-secrets` (see live Deployment envFrom).
#
# SUPERSEDED — files retained for reference, deliberately NOT applied:
#   deployment.yaml, hpa.yaml, pdb.yaml, ingress.yaml,
#   middleware-ratelimit.yaml, ecr-cred-refresher.yaml,
#   image-sync.yaml, config-sync.yaml, sync-webhook/, app-config.example.yaml
# These describe the retired containerized-ECR / SSM-sync design. The live
# cloudless-app Deployment is a hostPath standalone Next.js rollout owned by
# the deploy-pi.yml pipeline (Themis128/cloudless.gr). Applying them would
# fail on the immutable selector or, worse, repoint the Service selector and
# cause an endpoint outage. SSM sync is disabled live (SSM_DISABLED=1).

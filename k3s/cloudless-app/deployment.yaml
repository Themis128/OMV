apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudless-app
  namespace: cloudless
  labels:
    app.kubernetes.io/name: cloudless-app
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudless-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudless-app
    spec:
      imagePullSecrets:
        - name: regcred-ecr
      containers:
        - name: app
          image: 278585680617.dkr.ecr.us-east-1.amazonaws.com/cloudless-pi-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: cloudless-app-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

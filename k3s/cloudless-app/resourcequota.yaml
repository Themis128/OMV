# ResourceQuota for the cloudless namespace — reconciled to LIVE spec
# 2026-11-11. Sized for the single-replica hostPath standalone deployment
# (deploy-pi pipeline), not the retired 2-replica ECR design.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cloudless-quota
  namespace: cloudless
spec:
  hard:
    pods: "3"
    requests.memory: 512Mi
    limits.memory: 1536Mi

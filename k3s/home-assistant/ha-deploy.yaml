apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: false
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:stable
        env:
        - {name: TZ, value: Europe/Athens}
        ports:
        - {name: http, containerPort: 8123}
        volumeMounts:
        - {name: config, mountPath: /config}
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {cpu: 1500m, memory: 1536Mi}
        livenessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: ha-config-pvc

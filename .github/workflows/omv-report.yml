name: omv-report

# Capture the OMV host's health check + inventory and publish them to the
# 'omv-reports' branch. Runs on a GitHub-hosted runner that joins the
# tailnet via Tailscale and SSHes into the Pi — so no self-hosted runner is
# needed and the report can be produced entirely from GitHub's side.
#
# Required repository secrets
#   (Settings -> Secrets and variables -> Actions -> New repository secret):
#
#   TS_AUTHKEY    Tailscale auth key. Create at the Tailscale admin console
#                 -> Settings -> Keys -> Generate auth key (reusable;
#                 ephemeral recommended so CI nodes self-expire).
#
#   OMV_SSH_KEY   Private SSH key whose public half is in the Pi's
#                 ~/.ssh/authorized_keys for user tbaltzakis. Generate a
#                 dedicated key on the Pi:
#                   ssh-keygen -t ed25519 -N "" -f ~/.ssh/ci_omv
#                   cat ~/.ssh/ci_omv.pub >> ~/.ssh/authorized_keys
#                   cat ~/.ssh/ci_omv   # paste this as the secret
#
# Optional repository variable:
#   OMV_SSH_HOST  Pi address on the tailnet (default: 100.113.41.119).
#
# For a complete inventory the Pi user needs passwordless sudo; without it
# the root-only probes (blkid, smartctl, dmesg, journalctl) degrade to
# "(unavailable)" rather than failing the run.

on:
  workflow_dispatch:
  schedule:
    # Daily at 05:17 UTC — keeps the omv-reports branch fresh on its own.
    - cron: '17 5 * * *'
  push:
    # Editing this workflow fires one run, so a merge of a change here
    # produces an immediate report without a manual dispatch.
    branches: [main]
    paths:
      - .github/workflows/omv-report.yml

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: omv-report-ci

      - name: Run health check + inventory on the Pi
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST }}
        run: |
          host="${OMV_SSH_HOST:-100.113.41.119}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OMV_SSH_KEY" > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          ssh_opts=(-i "$HOME/.ssh/omv_key"
                    -o StrictHostKeyChecking=accept-new
                    -o ConnectTimeout=20)
          # Fail fast and loudly if the Pi is unreachable.
          if ! ssh "${ssh_opts[@]}" "tbaltzakis@${host}" 'echo connected'; then
            echo "ERROR: cannot SSH to the Pi at ${host} over Tailscale." >&2
            exit 1
          fi
          esc=$(printf '\033')
          # '|| true' so a health-check FAIL exit does not fail the workflow.
          ssh "${ssh_opts[@]}" "tbaltzakis@${host}" 'bash -s' \
            < scripts/omv-healthcheck.sh 2>&1 \
            | sed "s/${esc}\[[0-9;]*m//g" > "$RUNNER_TEMP/healthcheck.txt" || true
          ssh "${ssh_opts[@]}" "tbaltzakis@${host}" 'bash -s' \
            < scripts/omv-inventory.sh 2>&1 \
            | sed "s/${esc}\[[0-9;]*m//g" > "$RUNNER_TEMP/inventory.txt" || true

      - name: Publish to omv-reports branch
        run: |
          ts=$(date +%Y%m%d-%H%M%S)
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/omv-reports; then
            git checkout -B omv-reports origin/omv-reports
          else
            git checkout --orphan omv-reports
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p reports
          cp "$RUNNER_TEMP/healthcheck.txt" "reports/healthcheck-${ts}.txt"
          cp "$RUNNER_TEMP/inventory.txt" "reports/inventory-${ts}.txt"
          cp "$RUNNER_TEMP/healthcheck.txt" reports/latest-healthcheck.txt
          cp "$RUNNER_TEMP/inventory.txt" reports/latest-inventory.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "OMV report ${ts}"
          git push origin omv-reports

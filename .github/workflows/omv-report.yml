name: omv-report

# Capture the health check + inventory of both Pis — omv and omv-ha — and
# publish them to the 'omv-reports' branch. Runs on a GitHub-hosted runner
# that joins the tailnet via Tailscale and SSHes into omv; omv-ha (not on
# the tailnet) is reached via a LAN hop from omv.
#
# Self-diagnosing: a diagnostics file (Tailscale status, SSH results, key
# checks) is published on EVERY run, success or failure.
#
# Required repository secrets
#   (Settings -> Secrets and variables -> Actions -> New repository secret):
#
#   TS_AUTHKEY    Tailscale auth key (reusable; ephemeral recommended).
#                 Tailscale admin -> Settings -> Keys -> Generate auth key.
#
#   OMV_SSH_KEY   Private SSH key whose public half is in omv's
#                 ~/.ssh/authorized_keys for user tbaltzakis:
#                   ssh-keygen -t ed25519 -N "" -f ~/.ssh/ci_omv
#                   cat ~/.ssh/ci_omv.pub >> ~/.ssh/authorized_keys
#                   cat ~/.ssh/ci_omv   # paste this as the secret
#
# Optional repository variables:
#   OMV_SSH_HOST  omv address on the tailnet (default: 100.113.41.119).
#   OMV_HA_HOST   omv-ha address, reached via a LAN hop from omv
#                 (default: 192.168.1.130). omv must have passwordless
#                 SSH to tbaltzakis@OMV_HA_HOST for omv-ha to be collected.

on:
  workflow_dispatch:
  schedule:
    # Daily at 05:17 UTC — keeps the omv-reports branch fresh on its own.
    - cron: '17 5 * * *'
  push:
    # A change to the workflow, the report scripts, or the trigger file
    # fires a fresh run — so a report can be produced without the
    # Actions UI. To re-run on demand, bump .github/omv-report.trigger.
    branches: [main]
    paths:
      - .github/workflows/omv-report.yml
      - .github/omv-report.trigger
      - scripts/omv-healthcheck.sh
      - scripts/omv-inventory.sh

permissions:
  contents: write

jobs:
  report:
    runs-on: [self-hosted, omv-recovery]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: omv-report-ci

      - name: Collect reports and diagnostics
        id: collect
        if: always()
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST }}
          OMV_HA_HOST: ${{ vars.OMV_HA_HOST }}
        run: |
          # Never abort — diagnostics must be published whatever happens.
          set +e
          host="${OMV_SSH_HOST:-100.113.41.119}"
          ha_host="${OMV_HA_HOST:-192.168.1.130}"
          diag="$RUNNER_TEMP/diagnostics.txt"
          hc="$RUNNER_TEMP/healthcheck.txt"
          inv="$RUNNER_TEMP/inventory.txt"
          hc_ha="$RUNNER_TEMP/healthcheck-ha.txt"
          inv_ha="$RUNNER_TEMP/inventory-ha.txt"
          esc=$(printf '\033')

          {
            echo "omv-report diagnostics — $(date -u +%FT%TZ)"
            echo
            echo "Tailscale step outcome : ${{ steps.tailscale.outcome }}"
          } > "$diag"
          if [ -n "${OMV_SSH_KEY:-}" ]; then
            echo "OMV_SSH_KEY secret     : present" >> "$diag"
          else
            echo "OMV_SSH_KEY secret     : MISSING (empty)" >> "$diag"
          fi
          echo "omv tailnet host       : $host" >> "$diag"
          echo "omv-ha LAN host        : $ha_host" >> "$diag"
          {
            echo
            echo "## tailscale status"
            tailscale status 2>&1
          } >> "$diag"

          install -d -m 700 ~/.ssh
          # Strip CR — Windows-style line endings in the secret corrupt
          # the key and yield "error in libcrypto".
          printf '%s\n' "${OMV_SSH_KEY:-}" | tr -d '\r' > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          {
            echo
            echo "## OMV_SSH_KEY structure (no key material printed)"
            echo "line count : $(wc -l < ~/.ssh/omv_key)"
            if head -n1 ~/.ssh/omv_key | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
              echo "header     : BEGIN private-key header OK"
            else
              echo "header     : NOT a private-key header — wrong content pasted?"
            fi
            if ssh-keygen -y -f ~/.ssh/omv_key >/dev/null 2>&1; then
              echo "parse test : valid — ssh-keygen loaded the key"
            else
              echo "parse test : INVALID — ssh-keygen could not load the key"
            fi
          } >> "$diag"
          ssh_opts=(-i "$HOME/.ssh/omv_key"
                    -o StrictHostKeyChecking=accept-new
                    -o BatchMode=yes
                    -o ConnectTimeout=20)

          # --- omv (reached directly over the tailnet) ---
          {
            echo
            echo "## omv SSH connectivity test (tbaltzakis@$host)"
          } >> "$diag"
          ssh "${ssh_opts[@]}" "tbaltzakis@${host}" 'echo SSH-OK on $(hostname)' \
            >> "$diag" 2>&1
          ssh_rc=$?
          echo "(omv ssh exit code: $ssh_rc)" >> "$diag"

          if [ "$ssh_rc" -eq 0 ]; then
            ssh "${ssh_opts[@]}" "tbaltzakis@${host}" 'bash -s' \
              < scripts/omv-healthcheck.sh 2>&1 \
              | sed "s/${esc}\[[0-9;]*m//g" > "$hc"
            ssh "${ssh_opts[@]}" "tbaltzakis@${host}" 'bash -s' \
              < scripts/omv-inventory.sh 2>&1 \
              | sed "s/${esc}\[[0-9;]*m//g" > "$inv"
            echo "ssh=ok" >> "$GITHUB_OUTPUT"
          else
            echo "SSH to omv failed — see latest-diagnostics.txt." > "$hc"
            cp "$hc" "$inv"
            echo "ssh=fail" >> "$GITHUB_OUTPUT"
          fi

          # --- omv-ha (not on the tailnet — reached via a LAN hop from omv) ---
          {
            echo
            echo "## omv-ha collection (omv -> tbaltzakis@$ha_host)"
          } >> "$diag"
          if [ "$ssh_rc" -ne 0 ]; then
            echo "skipped — omv itself was unreachable" >> "$diag"
            echo "omv-ha not collected — omv was unreachable." > "$hc_ha"
            cp "$hc_ha" "$inv_ha"
          else
            ha_ssh="ssh -o BatchMode=yes -o ConnectTimeout=20"
            ha_ssh="$ha_ssh -o StrictHostKeyChecking=accept-new tbaltzakis@${ha_host}"
            ssh "${ssh_opts[@]}" "tbaltzakis@${host}" "$ha_ssh 'echo HA-SSH-OK'" \
              >> "$diag" 2>&1
            ha_rc=$?
            echo "(omv-ha ssh exit code: $ha_rc)" >> "$diag"
            if [ "$ha_rc" -eq 0 ]; then
              ssh "${ssh_opts[@]}" "tbaltzakis@${host}" "$ha_ssh 'bash -s'" \
                < scripts/omv-healthcheck.sh 2>&1 \
                | sed "s/${esc}\[[0-9;]*m//g" > "$hc_ha"
              ssh "${ssh_opts[@]}" "tbaltzakis@${host}" "$ha_ssh 'bash -s'" \
                < scripts/omv-inventory.sh 2>&1 \
                | sed "s/${esc}\[[0-9;]*m//g" > "$inv_ha"
            else
              {
                echo "omv-ha unreachable from omv (ssh exit $ha_rc)."
                echo "omv needs passwordless SSH to tbaltzakis@${ha_host}."
                echo "See latest-diagnostics.txt."
              } > "$hc_ha"
              cp "$hc_ha" "$inv_ha"
            fi
          fi
          exit 0

      - name: Publish to omv-reports branch
        if: always()
        run: |
          ts=$(date +%Y%m%d-%H%M%S)
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/omv-reports; then
            git checkout -B omv-reports origin/omv-reports
          else
            git checkout --orphan omv-reports
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p reports
          cp "$RUNNER_TEMP/diagnostics.txt" "reports/diagnostics-${ts}.txt"
          cp "$RUNNER_TEMP/diagnostics.txt" reports/latest-diagnostics.txt
          cp "$RUNNER_TEMP/healthcheck.txt" "reports/healthcheck-${ts}.txt"
          cp "$RUNNER_TEMP/healthcheck.txt" reports/latest-healthcheck.txt
          cp "$RUNNER_TEMP/inventory.txt" "reports/inventory-${ts}.txt"
          cp "$RUNNER_TEMP/inventory.txt" reports/latest-inventory.txt
          cp "$RUNNER_TEMP/healthcheck-ha.txt" "reports/healthcheck-ha-${ts}.txt"
          cp "$RUNNER_TEMP/healthcheck-ha.txt" reports/latest-healthcheck-ha.txt
          cp "$RUNNER_TEMP/inventory-ha.txt" "reports/inventory-ha-${ts}.txt"
          cp "$RUNNER_TEMP/inventory-ha.txt" reports/latest-inventory-ha.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "OMV report ${ts}"
          # Retry push up to 3 times with a rebase to handle races with the
          # Pi cron job (omv-report-to-github.sh) writing to the same branch.
          push_ok=0
          for attempt in 1 2 3; do
            if git push origin omv-reports; then
              push_ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push attempt $attempt failed — rebasing and retrying..."
              git pull --rebase origin omv-reports || true
            fi
          done
          [ "$push_ok" -eq 1 ] || { echo "Push failed after 3 attempts" >&2; exit 1; }

      - name: Fail the run if omv was unreachable
        if: always() && steps.collect.outputs.ssh != 'ok'
        run: |
          echo "omv was unreachable — diagnostics were published to the" >&2
          echo "omv-reports branch (reports/latest-diagnostics.txt)." >&2
          exit 1

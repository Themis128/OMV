name: list-secrets

# Lists all repo secret NAMES (not values — GitHub never exposes values).
# Posts the list to the status board issue #66.
# Trigger: push to .github/dispatches/list-secrets.json

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/dispatches/list-secrets.json]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List secret names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          names=$(gh api "repos/${REPO}/actions/secrets" --paginate \
            --jq '[.secrets[].name] | sort | .[]' | sed 's/^/- /')
          var_names=$(gh api "repos/${REPO}/actions/variables" --paginate \
            --jq '[.variables[] | "- " + .name + " = " + .value] | .[]' 2>/dev/null || echo "(none)")
          body="## Repo Secrets (names only — values are never readable)

${names}

## Repo Variables (names + values)

${var_names}"
          gh api "repos/${REPO}/issues/66/comments" -f body="$body"
          echo "Posted to issue #66."

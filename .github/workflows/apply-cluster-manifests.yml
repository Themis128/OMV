name: apply-cluster-manifests

# Apply the cluster-side manifests for cloudless.gr (just the Ingress today —
# cert-manager / Cloudflare API token are no longer required because the
# Cloudflare Tunnel handles all public TLS and uses noTLSVerify to the
# origin). Runs on omv via Tailscale+SSH.
#
# Required repository secrets:
#   TS_OAUTH_CLIENT_ID  Tailscale OAuth client ID (from https://login.tailscale.com/admin/settings/oauth).
#   TS_OAUTH_SECRET    Tailscale OAuth client secret.
#   OMV_SSH_KEY   Private SSH key for tbaltzakis@omv.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/dispatches/apply-cluster-manifests.json]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — check required secrets
        id: preflight
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
        run: |
          missing=()
          [ -z "$TS_OAUTH_CLIENT_ID" ] && missing+=(TS_OAUTH_CLIENT_ID)
          [ -z "$TS_OAUTH_SECRET" ]    && missing+=(TS_OAUTH_SECRET)
          [ -z "$OMV_SSH_KEY" ]        && missing+=(OMV_SSH_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required secrets: ${missing[*]}"
            echo "Set them in Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci
          hostname: omv-apply-manifests-ci
      - name: Configure SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OMV_SSH_KEY}" | tr -d '\r' > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          printf 'Host %s\n  IdentityFile ~/.ssh/omv_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "${OMV_SSH_HOST}" >> ~/.ssh/config

      - name: Apply Ingress and verify
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -euo pipefail
          cd ~/OMV && git pull -q origin main
          sudo k3s kubectl apply --validate=false -f k3s/cloudless-app/ingress.yaml
          sudo k3s kubectl -n cloudless get ingress
          EOF

      - name: Post result to status board
        if: always()
        uses: ./.github/actions/post-status
        with:
          detail: >-
            preflight=${{ steps.preflight.outcome }}
            tailscale=${{ steps.tailscale.outcome }}

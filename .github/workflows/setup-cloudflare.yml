name: setup-cloudflare

# Operator-triggered Cloudflare bootstrap for cloudless.gr:
#   1. ensure the zone exists in Cloudflare (creates it if not)
#   2. create the "cloudless" Tunnel via API + write credentials JSON on omv
#   3. print the assigned NS values (you set these at the registrar)
#   4. optionally wait until NS delegation propagates
#
# Required repository secrets:
#   TS_OAUTH_CLIENT_ID  Tailscale OAuth client ID (from https://login.tailscale.com/admin/settings/oauth).
#   TS_OAUTH_SECRET    Tailscale OAuth client secret.
#   OMV_SSH_KEY   Private SSH key for tbaltzakis@omv.
#
# Pass the Cloudflare API token as a masked workflow input (not stored as a
# repo secret — one-shot use during the migration).

on:
  workflow_dispatch:
    inputs:
      cf_api_token:
        description: "Cloudflare API token (Account:CF Tunnel:Edit + Zone:Zone:Edit + Zone:DNS:Edit)."
        type: string
        required: true
      zone:
        description: "Zone name."
        type: string
        default: "cloudless.gr"
      tunnel_name:
        description: "Tunnel name."
        type: string
        default: "cloudless"
      wait_for_ns:
        description: "Block until NS delegation to Cloudflare is observed."
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [.github/dispatches/setup-cloudflare.json]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/dispatches/setup-cloudflare.json ]; then
            # Sensitive token comes from repo secret when push-triggered
            cf_api_token="${{ secrets.CLOUDFLARE_API_TOKEN }}"
            zone=$(jq -r '.inputs.zone // "cloudless.gr"' .github/dispatches/setup-cloudflare.json)
            tunnel_name=$(jq -r '.inputs.tunnel_name // "cloudless"' .github/dispatches/setup-cloudflare.json)
            wait_for_ns=$(jq -r '.inputs.wait_for_ns // "true"' .github/dispatches/setup-cloudflare.json)
          else
            cf_api_token="${{ inputs.cf_api_token }}"
            zone="${{ inputs.zone || 'cloudless.gr' }}"
            tunnel_name="${{ inputs.tunnel_name || 'cloudless' }}"
            wait_for_ns="${{ inputs.wait_for_ns || 'true' }}"
          fi
          echo "::add-mask::$cf_api_token"
          printf 'zone=%s\ntunnel_name=%s\nwait_for_ns=%s\n' "$zone" "$tunnel_name" "$wait_for_ns" >> "$GITHUB_OUTPUT"
          echo "cf_api_token=$cf_api_token" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci
          hostname: omv-cf-bootstrap-ci
      - name: Configure SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OMV_SSH_KEY}" | tr -d '\r' > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          printf 'Host %s\n  IdentityFile ~/.ssh/omv_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "${OMV_SSH_HOST}" >> ~/.ssh/config

      - name: Run setup-cloudflare-dns-and-tunnel.sh on omv
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
          CF_TOKEN: ${{ steps.inputs.outputs.cf_api_token }}
          ZONE: ${{ steps.inputs.outputs.zone }}
          TUNNEL_NAME: ${{ steps.inputs.outputs.tunnel_name }}
          WAIT_NS: ${{ steps.inputs.outputs.wait_for_ns == 'true' && '1' || '0' }}
        run: |
          TOKEN_B64="$(printf '%s' "${CF_TOKEN}" | base64 -w0)"
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << EOF
          set -euo pipefail
          TOKEN="\$(printf '%s' '${TOKEN_B64}' | base64 -d)"
          cd ~/OMV && git pull -q origin main
          sudo CF_API_TOKEN="\${TOKEN}" \
               ZONE='${ZONE}' \
               TUNNEL_NAME='${TUNNEL_NAME}' \
               WAIT_NS='${WAIT_NS}' \
               ./scripts/setup-cloudflare-dns-and-tunnel.sh
          EOF

      - name: Post result to status board
        if: always()
        uses: ./.github/actions/post-status

name: store-aws-credentials

# Store AWS access key ID + secret as GitHub repo secrets.
# Run this after rotating the AWS IAM key in the AWS Console.
#
# Steps:
#   1. AWS IAM Console → Users → Security credentials
#      → deactivate old key (AKIAUBXIAELU5SADA3XL)
#      → Create new access key → copy ID + secret
#   2. Run this workflow via Actions tab → workflow_dispatch
#      with the new key values.
#   3. Trigger rotate-k3s-credentials to verify.

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: "New AWS_ACCESS_KEY_ID"
        required: true
        type: string
      aws_secret_access_key:
        description: "New AWS_SECRET_ACCESS_KEY"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - name: Install PyNaCl
        run: pip install --quiet PyNaCl requests

      - name: Store AWS credentials as repo secrets
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ inputs.aws_access_key_id }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ inputs.aws_secret_access_key }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, base64, requests
          from nacl import encoding, public

          key_id_val  = os.environ["AWS_ACCESS_KEY_ID_INPUT"].strip()
          secret_val  = os.environ["AWS_SECRET_ACCESS_KEY_INPUT"].strip()
          gh_token    = os.environ["GH_TOKEN"]
          repo        = os.environ["REPO"]

          if not key_id_val or not secret_val:
              raise SystemExit("ERROR: both aws_access_key_id and aws_secret_access_key are required.")

          gh_api  = f"https://api.github.com/repos/{repo}/actions/secrets"
          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          pk      = requests.get(f"{gh_api}/public-key", headers=headers)
          pk.raise_for_status()
          pk_data = pk.json()
          repo_key_id = pk_data["key_id"]
          pub_key = public.PublicKey(pk_data["key"].encode(), encoding.Base64Encoder)

          def store(name, value):
              box       = public.SealedBox(pub_key)
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              r = requests.put(
                  f"{gh_api}/{name}",
                  headers=headers,
                  json={"encrypted_value": encrypted, "key_id": repo_key_id},
              )
              r.raise_for_status()
              print(f"Stored {name} ({r.status_code})")

          store("AWS_ACCESS_KEY_ID",     key_id_val)
          store("AWS_SECRET_ACCESS_KEY", secret_val)

          print(f"Done. Stored key ID: {key_id_val[:8]}…")
          print("Next: trigger rotate-k3s-credentials to verify the new key works.")
          PYEOF

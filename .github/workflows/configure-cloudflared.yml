name: configure-cloudflared

# Operator-triggered cloudflared (Cloudflare Tunnel) reconfiguration on omv.
# Pushes /etc/cloudflared/config.yml that routes cloudless.gr (and any extra
# hostnames you pass) → Traefik :18443 via the existing tunnel, then
# restarts cloudflared. No router port-forward needed.
#
# Required repository secrets:
#   TS_OAUTH_CLIENT_ID  Tailscale OAuth client ID (from https://login.tailscale.com/admin/settings/oauth).
#   TS_OAUTH_SECRET    Tailscale OAuth client secret.
#   OMV_SSH_KEY   Private SSH key for tbaltzakis@omv (Tailscale IP).
#
# Optional repository variables:
#   OMV_SSH_HOST  omv's Tailscale IP (default: 100.113.41.119)

on:
  workflow_dispatch:
    inputs:
      hostnames:
        description: "Comma-separated hostnames the tunnel should serve."
        type: string
        default: "cloudless.gr,manage.cloudless.gr"
      tunnel_name:
        description: "Cloudflare Tunnel name (matches the credentials file in /etc/cloudflared)."
        type: string
        default: "cloudless"
  push:
    branches: [main]
    paths: [.github/dispatches/configure-cloudflared.json]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/dispatches/configure-cloudflared.json ]; then
            hostnames=$(jq -r '.inputs.hostnames // "cloudless.gr,manage.cloudless.gr"' .github/dispatches/configure-cloudflared.json)
            tunnel_name=$(jq -r '.inputs.tunnel_name // "cloudless"' .github/dispatches/configure-cloudflared.json)
          else
            hostnames="${{ inputs.hostnames || 'cloudless.gr,manage.cloudless.gr' }}"
            tunnel_name="${{ inputs.tunnel_name || 'cloudless' }}"
          fi
          printf 'hostnames=%s\ntunnel_name=%s\n' "$hostnames" "$tunnel_name" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci
          hostname: omv-cloudflared-ci
      - name: Configure SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OMV_SSH_KEY}" | tr -d '\r' > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          printf 'Host %s\n  IdentityFile ~/.ssh/omv_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "${OMV_SSH_HOST}" >> ~/.ssh/config

      - name: Apply cloudflared config on omv
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
          HOSTNAMES: ${{ steps.inputs.outputs.hostnames }}
          TUNNEL_NAME: ${{ steps.inputs.outputs.tunnel_name }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << EOF
          set -euo pipefail
          cd ~/OMV && git pull -q origin main
          sudo HOSTNAMES='${HOSTNAMES}' TUNNEL_NAME='${TUNNEL_NAME}' \
            ./scripts/configure-cloudflared.sh
          EOF

      - name: Configure cloudflared on omv-ha (if installed)
        id: omv_ha_cloudflared
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
          OMV_HA_HOST: ${{ vars.OMV_HA_HOST || '192.168.1.130' }}
          HOSTNAMES: ${{ steps.inputs.outputs.hostnames }}
          TUNNEL_NAME: ${{ steps.inputs.outputs.tunnel_name }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            "ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
              tbaltzakis@${OMV_HA_HOST} bash -s" << EOF
          set -euo pipefail
          if ! command -v cloudflared >/dev/null 2>&1; then
            echo "cloudflared not installed on omv-ha — skipping"
            exit 0
          fi
          cd ~/OMV && git pull -q origin main
          sudo HOSTNAMES='${HOSTNAMES}' TUNNEL_NAME='${TUNNEL_NAME}' \
            ./scripts/configure-cloudflared.sh
          EOF

      - name: Verify tunnel is serving
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
          HOSTNAMES: ${{ steps.inputs.outputs.hostnames }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            'sudo systemctl is-active cloudflared && sudo journalctl -u cloudflared -n 20 --no-pager'
          PRIMARY="$(printf '%s' "${HOSTNAMES}" | cut -d, -f1)"
          echo "Probing https://${PRIMARY}/api/health from the runner..."
          for i in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://${PRIMARY}/api/health" || echo 000)"
            echo "  attempt $i: HTTP ${code}"
            [ "${code}" = "200" ] && exit 0
            sleep 10
          done
          echo "Health probe did not return 200 — check DNS delegation and tunnel logs."
          exit 1

      - name: Post result to status board
        if: always()
        uses: ./.github/actions/post-status

name: generate-ts-authkey

# Generate a reusable Tailscale auth key for the themis128.github tailnet,
# store it as TS_NEW_AUTHKEY in GitHub repo secrets, then trigger
# register-tailscale-nodes to migrate omv automatically.
#
# Required secrets:
#   TS_API_KEY  — Tailscale personal API key
#               Tailscale admin → Settings → Keys → Generate API key
#               Add at: https://github.com/Themis128/OMV/settings/secrets/actions
#   GH_PAT      — classic PAT with repo scope (already required by other workflows)
#
# Triggered by push to dispatch file or manually via workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      tailnet:
        description: "Tailscale tailnet slug"
        required: false
        default: "themis128.github"
        type: string
      skip_trigger:
        description: "Store key only; do NOT auto-trigger register-tailscale-nodes"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths: [.github/dispatches/generate-ts-authkey.json]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install --quiet PyNaCl requests

      - name: Preflight — check required secrets
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          missing=()
          [ -z "$TS_API_KEY" ] && missing+=(TS_API_KEY)
          [ -z "$GH_PAT" ]     && missing+=(GH_PAT)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing secrets: ${missing[*]}"
            echo "Add at: https://github.com/Themis128/OMV/settings/secrets/actions"
            exit 1
          fi
          echo "All required secrets present."

      - name: Generate auth key + store as TS_NEW_AUTHKEY
        id: generate
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          TAILNET: ${{ inputs.tailnet || 'themis128.github' }}
        run: |
          python3 << 'PYEOF'
          import os, base64, requests
          from nacl import encoding, public

          ts_api_key = os.environ["TS_API_KEY"].strip()
          gh_token   = os.environ["GH_TOKEN"]
          repo       = os.environ["REPO"]
          tailnet    = os.environ["TAILNET"]

          # Generate reusable auth key via Tailscale API
          print(f"Generating reusable auth key for tailnet: {tailnet}")
          resp = requests.post(
              f"https://api.tailscale.com/api/v2/tailnet/{tailnet}/keys",
              headers={"Authorization": f"Bearer {ts_api_key}"},
              json={
                  "capabilities": {
                      "devices": {
                          "create": {
                              "reusable": True,
                              "ephemeral": False,
                              "preauthorized": True,
                              "tags": []
                          }
                      }
                  },
                  "expirySeconds": 86400,
                  "description": "OMV node migration — auto-generated by CI"
              },
          )
          if not resp.ok:
              raise SystemExit(f"ERROR: Tailscale API {resp.status_code}: {resp.text}")
          auth_key = resp.json()["key"]
          key_id   = resp.json()["id"]
          print(f"Auth key generated: id={key_id}")

          # Store as TS_NEW_AUTHKEY in GitHub repo secrets
          gh_api  = f"https://api.github.com/repos/{repo}/actions/secrets"
          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          pk = requests.get(f"{gh_api}/public-key", headers=headers)
          pk.raise_for_status()
          pk_data = pk.json()
          pub_key = public.PublicKey(pk_data["key"].encode(), encoding.Base64Encoder)

          box       = public.SealedBox(pub_key)
          encrypted = base64.b64encode(box.encrypt(auth_key.encode())).decode()
          r = requests.put(
              f"{gh_api}/TS_NEW_AUTHKEY",
              headers=headers,
              json={"encrypted_value": encrypted, "key_id": pk_data["key_id"]},
          )
          r.raise_for_status()
          print(f"Stored TS_NEW_AUTHKEY ({r.status_code})")
          print("Done.")
          PYEOF

      - name: Trigger register-tailscale-nodes
        if: ${{ inputs.skip_trigger != true }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, base64, json, datetime, requests

          gh_token = os.environ["GH_TOKEN"]
          repo     = os.environ["REPO"]

          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          url  = f"https://api.github.com/repos/{repo}/contents/.github/dispatches/register-tailscale-nodes.json"
          resp = requests.get(url, headers=headers)
          resp.raise_for_status()
          sha  = resp.json()["sha"]

          content = json.dumps({"triggered_at": datetime.datetime.utcnow().isoformat() + "Z"}, indent=2) + "\n"
          r = requests.put(url, headers=headers, json={
              "message": "chore: trigger register-tailscale-nodes (auto after TS_NEW_AUTHKEY generation)",
              "content": base64.b64encode(content.encode()).decode(),
              "sha": sha,
          })
          r.raise_for_status()
          print(f"register-tailscale-nodes triggered ({r.status_code})")
          print("Watch the run at: https://github.com/" + repo + "/actions/workflows/register-tailscale-nodes.yml")
          PYEOF

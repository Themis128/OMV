name: approve-tailscale-route-omv-ha

# Approves the 192.168.1.0/24 subnet route advertised by omv-ha via the
# Tailscale API so tailnet devices can reach LAN hosts (cameras, printer,
# TP-Link infra) that cannot run tailscaled themselves.
#
# Required secret: TS_API_KEY (Tailscale personal API key)

on:
  push:
    paths:
      - .github/dispatches/approve-ts-route-omv-ha.json

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve subnet route 192.168.1.0/24 for omv-ha
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -e
          DEVICES=$(curl -sf -H "Authorization: Bearer ${TS_API_KEY}" \
            "https://api.tailscale.com/api/v2/tailnet/-/devices")
          DEVICE_ID=$(echo "${DEVICES}" | jq -r ".devices[] | select(.hostname == \"omv-ha\") | .id")
          if [ -z "${DEVICE_ID}" ] || [ "${DEVICE_ID}" = "null" ]; then
            echo "ERROR: omv-ha not found"; echo "${DEVICES}" | jq -r ".devices[].hostname"; exit 1
          fi
          echo "omv-ha device ID: ${DEVICE_ID}"
          ROUTES=$(curl -sf -H "Authorization: Bearer ${TS_API_KEY}" \
            "https://api.tailscale.com/api/v2/device/${DEVICE_ID}/routes")
          echo "Advertised:"; echo "${ROUTES}" | jq -r ".advertisedRoutes[]"
          echo "Enabled:"; echo "${ROUTES}" | jq -r ".enabledRoutes[]"
          EXISTING=$(echo "${ROUTES}" | jq "[.enabledRoutes[]?]")
          NEW_ROUTES=$(echo "${EXISTING}" | jq ". + [\"192.168.1.0/24\"] | unique")
          RESULT=$(curl -sf -H "Authorization: Bearer ${TS_API_KEY}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"routes\": ${NEW_ROUTES}}" \
            "https://api.tailscale.com/api/v2/device/${DEVICE_ID}/routes")
          echo "${RESULT}" | jq -r ".enabledRoutes[]"
          echo "SUCCESS: 192.168.1.0/24 approved for omv-ha."

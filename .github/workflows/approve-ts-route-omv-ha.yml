name: approve-tailscale-route-omv-ha

# Approves the 192.168.1.0/24 subnet route advertised by omv-ha.
# Uses the TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET secrets (client-credentials
# grant) instead of the dead TS_API_KEY.

on:
  push:
    paths:
      - .github/dispatches/approve-ts-route-omv-ha.json
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Mint OAuth access token
        id: token
        env:
          CID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CSEC: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -e
          RESP=$(curl -sf -X POST "https://api.tailscale.com/api/v2/oauth/token" \
            -d "client_id=${CID}" -d "client_secret=${CSEC}" \
            -d "grant_type=client_credentials")
          TOK=$(echo "$RESP" | jq -r .access_token)
          [ "$TOK" = "null" ] || [ -z "$TOK" ] && { echo "token mint failed"; exit 1; }
          echo "::add-mask::$TOK"
          echo "tok=$TOK" >> "$GITHUB_OUTPUT"

      - name: Approve subnet route 192.168.1.0/24 for omv-ha
        env:
          TOK: ${{ steps.token.outputs.tok }}
        run: |
          set -e
          DEVICES=$(curl -s -H "Authorization: Bearer ${TOK}" \
            "https://api.tailscale.com/api/v2/tailnet/-/devices")
          echo "$DEVICES" | jq -r ".devices[].hostname" | head -20
          DEVICE_ID=$(echo "$DEVICES" | jq -r ".devices[] | select(.hostname == \"omv-ha\") | .id")
          if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "null" ]; then
            echo "ERROR: omv-ha not found"; exit 1
          fi
          echo "omv-ha device ID: $DEVICE_ID"
          ROUTES=$(curl -s -H "Authorization: Bearer ${TOK}" \
            "https://api.tailscale.com/api/v2/device/${DEVICE_ID}/routes")
          echo "Advertised:"; echo "$ROUTES" | jq -r ".advertisedRoutes[]? // empty"
          echo "Enabled:"; echo "$ROUTES" | jq -r ".enabledRoutes[]? // empty"
          EXISTING=$(echo "$ROUTES" | jq "[.enabledRoutes[]?]")
          NEW_ROUTES=$(echo "$EXISTING" | jq ". + [\"192.168.1.0/24\"] | unique")
          RESULT=$(curl -s -w "\nHTTP:%{http_code}" -H "Authorization: Bearer ${TOK}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"routes\": ${NEW_ROUTES}}" \
            "https://api.tailscale.com/api/v2/device/${DEVICE_ID}/routes")
          echo "$RESULT"

name: list-cognito-users

# Lists all users in the Cognito user pool and posts the result as a comment
# on the status board issue (#66).
#
# Required repository variables:
#   AWS_ACCOUNT_ID   12-digit AWS account ID.
#
# Required IAM permission on GitHubActionsOIDC role:
#   cognito-idp:ListUsers on arn:aws:cognito-idp:us-east-1:*:userpool/us-east-1_JQWwFbO9a

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/dispatches/list-cognito-users.json]

permissions:
  contents: read
  issues: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  list-users:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "ERROR: AWS_ACCOUNT_ID repo variable is not set."
            echo "Go to: Settings -> Secrets and variables -> Actions -> Variables -> New variable"
            echo "Name: AWS_ACCOUNT_ID  Value: your 12-digit AWS account ID"
            exit 1
          fi
          echo "AWS_ACCOUNT_ID is set."

      - name: Configure AWS credentials
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsOIDC
          role-session-name: list-cognito-users
          aws-region: us-east-1

      - name: List Cognito users
        id: list_users
        run: |
          set -euo pipefail
          USER_POOL_ID="us-east-1_JQWwFbO9a"

          echo "Querying Cognito user pool: $USER_POOL_ID"
          USERS_JSON="$(aws cognito-idp list-users --user-pool-id "$USER_POOL_ID" --region us-east-1)"
          COUNT="$(printf '%s' "$USERS_JSON" | jq '.Users | length')"

          {
            echo "## Cognito User Pool: \`$USER_POOL_ID\`"
            echo "**Total users**: $COUNT"
            echo ""
            echo "| Username | Email | Status | Enabled | Created |"
            echo "|---|---|---|---|---|"
            printf '%s' "$USERS_JSON" | jq -r '.Users[] | [
              .Username,
              ((.Attributes // []) | map(select(.Name == "email")) | first | .Value // "-"),
              .UserStatus,
              (if .Enabled then "Yes" else "No" end),
              (.UserCreateDate | split("T")[0])
            ] | "| " + join(" | ") + " |"'
          } > /tmp/cognito-report.md

          echo "Found $COUNT users."
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Post user list to status board
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ts=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [ -f /tmp/cognito-report.md ]; then
            report="$(cat /tmp/cognito-report.md)"
          else
            report="_(query failed — see run logs)_"
          fi
          {
            echo "## Cognito Users Report"
            echo ""
            echo "Run: $RUN_URL"
            echo "At: $ts"
            echo ""
            echo "$report"
          } | gh api "repos/${{ github.repository }}/issues/66/comments" -f body=@-

name: list-cognito-users

# Lists all users in the Cognito user pool and posts the result as a comment
# on the status board issue (#66).
#
# Required IAM: role cloudless-github-oidc (OIDC trust for Themis128/OMV)
#   cognito-idp:ListUsers on us-east-1_1Bq3Mpqer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/dispatches/list-cognito-users.json]

permissions:
  contents: read
  issues: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  list-users:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::278585680617:role/cloudless-github-oidc
          role-session-name: list-cognito-users
          aws-region: us-east-1

      - name: List Cognito users
        id: list_users
        run: |
          set -euo pipefail
          USER_POOL_ID="us-east-1_1Bq3Mpqer"

          echo "Querying Cognito user pool: $USER_POOL_ID"
          USERS_JSON="$(aws cognito-idp list-users --user-pool-id "$USER_POOL_ID" --region us-east-1)"
          COUNT="$(printf '%s' "$USERS_JSON" | jq '.Users | length')"

          {
            echo "## Cognito User Pool: \`$USER_POOL_ID\`"
            echo "**Total users**: $COUNT"
            echo ""
            echo "| Username | Email | Status | Enabled | Created |"
            echo "|---|---|---|---|---|"
            printf '%s' "$USERS_JSON" | jq -r '.Users[] | [
              .Username,
              ((.Attributes // []) | map(select(.Name == "email")) | first | .Value // "-"),
              .UserStatus,
              (if .Enabled then "Yes" else "No" end),
              (.UserCreateDate | split("T")[0])
            ] | "| " + join(" | ") + " |"'
          } > /tmp/cognito-report.md

          echo "Found $COUNT users."
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Post user list to status board
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ts=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [ -f /tmp/cognito-report.md ]; then
            report="$(cat /tmp/cognito-report.md)"
          else
            report="_(query failed — see run logs)_"
          fi
          {
            echo "## Cognito Users Report"
            echo ""
            echo "Run: $RUN_URL"
            echo "At: $ts"
            echo ""
            echo "$report"
          } > /tmp/cognito-users-comment.md
          gh api "repos/${{ github.repository }}/issues/66/comments" -F body=@/tmp/cognito-users-comment.md

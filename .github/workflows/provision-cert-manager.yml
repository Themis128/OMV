name: provision-cert-manager

# Provision the cert-manager credentials and ClusterIssuers on the cluster:
#   • letsencrypt-route53 ClusterIssuer  (Route53 DNS-01 solver for cloudless.gr)
#   • letsencrypt-route53-staging ClusterIssuer
#
# Note: cloudless.online was retired. The Cloudflare solver has been removed;
# only Route53 (cloudless.gr) remains. cert-manager is also no longer strictly
# required — Cloudflare Universal SSL handles TLS for cloudless.gr.
#
# Uses Tailscale + SSH to reach omv, then runs `sudo k3s kubectl` so the
# k3s kubeconfig is used — plain `kubectl` on the tbaltzakis user requires
# a separate kubeconfig and fails OpenAPI validation.
#
# Required repository secrets:
#   TS_OAUTH_CLIENT_ID      Tailscale OAuth client ID
#   TS_OAUTH_SECRET         Tailscale OAuth client secret
#   OMV_SSH_KEY             Private SSH key for tbaltzakis@omv

on:
  workflow_dispatch:
    inputs:
      skip_issuer:
        description: "Apply Secret only, skip ClusterIssuer update"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    paths:
      - .github/dispatches/provision-cert-manager.json

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/dispatches/provision-cert-manager.json ]; then
            skip_issuer=$(jq -r '.inputs.skip_issuer // "false"' .github/dispatches/provision-cert-manager.json)
          else
            skip_issuer="${{ inputs.skip_issuer || 'false' }}"
          fi
          printf 'skip_issuer=%s\n' "$skip_issuer" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: omv-cert-manager-ci

      - name: Configure SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OMV_SSH_KEY}" | tr -d '\r' > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          printf 'Host %s\n  IdentityFile ~/.ssh/omv_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "${OMV_SSH_HOST}" >> ~/.ssh/config

      - name: Copy provision script
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          scp -i ~/.ssh/omv_key -o StrictHostKeyChecking=accept-new \
            k3s/cert-manager/provision-secrets.sh \
            "tbaltzakis@${OMV_SSH_HOST}:/tmp/provision-secrets.sh"

      - name: Run provision script
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SKIP_FLAG: ${{ steps.inputs.outputs.skip_issuer == 'true' && '--skip-issuer' || '' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            "chmod +x /tmp/provision-secrets.sh && \
             sudo /tmp/provision-secrets.sh --cloudflare-token '${CLOUDFLARE_API_TOKEN}' ${SKIP_FLAG}"

      - name: Post result to status board
        if: always()
        uses: ./.github/actions/post-status

name: provision-cert-manager

# Provision the cert-manager credentials and ClusterIssuers on the cluster:
#   • cloudflare-api-token Secret  (Cloudflare DNS-01 solver for cloudless.online)
#   • letsencrypt-route53 ClusterIssuer  (Cloudflare solver for .online, Route53 for .gr)
#   • letsencrypt-route53-staging ClusterIssuer
#
# Uses Tailscale + SSH to reach omv, then runs `sudo k3s kubectl` so the
# k3s kubeconfig is used — plain `kubectl` on the tbaltzakis user requires
# a separate kubeconfig and fails OpenAPI validation.
#
# Required repository secrets:
#   TS_OAUTH_CLIENT_ID      Tailscale OAuth client ID
#   TS_OAUTH_SECRET         Tailscale OAuth client secret
#   OMV_SSH_KEY             Private SSH key for tbaltzakis@omv
#   CLOUDFLARE_API_TOKEN    Cloudflare token with Zone→DNS→Edit on cloudless.online

on:
  workflow_dispatch:
    inputs:
      skip_issuer:
        description: "Apply Secret only, skip ClusterIssuer update"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    branches: [main]
    paths: [.github/dispatches/provision-cert-manager.json]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/dispatches/provision-cert-manager.json ]; then
            skip_issuer=$(jq -r '.inputs.skip_issuer // "false"' .github/dispatches/provision-cert-manager.json)
          else
            skip_issuer="${{ inputs.skip_issuer || 'false' }}"
          fi
          echo "skip_issuer=$skip_issuer" >> "$GITHUB_OUTPUT"

      - name: Preflight — check required secrets
        id: preflight
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
        run: |
          missing=()
          [ -z "$TS_OAUTH_CLIENT_ID" ] && missing+=(TS_OAUTH_CLIENT_ID)
          [ -z "$TS_OAUTH_SECRET" ]    && missing+=(TS_OAUTH_SECRET)
          [ -z "$OMV_SSH_KEY" ]        && missing+=(OMV_SSH_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required secrets: ${missing[*]}"
            echo "Set them in Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          hostname: omv-provision-cert-manager-ci

      - name: Configure SSH
        id: ssh_config
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OMV_SSH_KEY}" | tr -d '\r' > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          printf 'Host %s\n  IdentityFile ~/.ssh/omv_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "${OMV_SSH_HOST}" >> ~/.ssh/config

      - name: Ensure cert-manager namespace exists
        id: ns
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            "sudo k3s kubectl get ns cert-manager >/dev/null 2>&1 || sudo k3s kubectl create ns cert-manager"

      - name: Apply cloudflare-api-token Secret
        id: apply_secret
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            "sudo k3s kubectl apply --validate=false -f - -n cert-manager" <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: cloudflare-api-token
            namespace: cert-manager
          type: Opaque
          stringData:
            api-token: "${CLOUDFLARE_API_TOKEN}"
          EOF

      - name: Apply ClusterIssuers
        id: apply_issuers
        if: ${{ steps.inputs.outputs.skip_issuer != 'true' }}
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'SSHEOF'
          set -euo pipefail
          cd ~/OMV && git pull -q origin main
          sudo k3s kubectl apply --validate=false -f k3s/cert-manager/cluster-issuer.yaml
          SSHEOF

      - name: Verify
        id: verify
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'SSHEOF'
          set -euo pipefail
          echo "=== ClusterIssuers ==="
          sudo k3s kubectl get clusterissuer \
            -o custom-columns='NAME:.metadata.name,READY:.status.conditions[0].status,REASON:.status.conditions[0].reason' \
            2>/dev/null || echo "(no ClusterIssuers yet)"
          echo "=== cloudflare-api-token Secret ==="
          sudo k3s kubectl get secret cloudflare-api-token -n cert-manager \
            -o custom-columns='NAME:.metadata.name,TYPE:.type,CREATED:.metadata.creationTimestamp' \
            2>/dev/null || echo "(secret not found)"
          SSHEOF

      - name: Post result to status board
        if: always()
        uses: ./.github/actions/post-status
        with:
          detail: >-
            preflight=${{ steps.preflight.outcome }}
            tailscale=${{ steps.tailscale.outcome }}
            ns=${{ steps.ns.outcome }}
            secret=${{ steps.apply_secret.outcome }}
            issuers=${{ steps.apply_issuers.outcome }}
            verify=${{ steps.verify.outcome }}

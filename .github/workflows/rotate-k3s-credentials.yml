name: rotate-k3s-credentials

# Reads AWS credentials from /etc/cloudless/aws-creds.env on omv (maintained manually),
# regenerates /etc/rancher/k3s/config.yaml, and restarts k3s.
#
# Required repository secrets:
#   TS_OAUTH_CLIENT_ID  Tailscale OAuth client ID
#   TS_OAUTH_SECRET     Tailscale OAuth client secret
#   OMV_SSH_KEY         Private SSH key for tbaltzakis@omv (Tailscale IP)
#
# To update credentials: SSH into omv and edit /etc/cloudless/aws-creds.env,
# then trigger this workflow to re-apply them.
#
# Optional repository variables:
#   OMV_SSH_HOST  omv's Tailscale IP (default: 100.113.41.119)

on:
  workflow_dispatch:
    inputs:
      verify_snapshot:
        description: "After applying, force an etcd snapshot and verify it lands in S3."
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/dispatches/rotate-k3s-credentials.json]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/dispatches/rotate-k3s-credentials.json ]; then
            verify_snapshot=$(jq -r '.inputs.verify_snapshot // "false"' .github/dispatches/rotate-k3s-credentials.json)
          else
            verify_snapshot="${{ inputs.verify_snapshot || 'false' }}"
          fi
          printf 'verify_snapshot=%s\n' "$verify_snapshot" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci
          hostname: omv-k3s-rotate-ci

      - name: Configure SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OMV_SSH_KEY}" | tr -d '\r' > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          printf 'Host %s\n  IdentityFile ~/.ssh/omv_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "${OMV_SSH_HOST}" >> ~/.ssh/config

      - name: Apply credentials from env file on omv
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -euo pipefail
          cd ~/OMV && git pull -q origin main
          sudo bash ./scripts/configure-k3s.sh
          sudo systemctl restart k3s
          EOF

      - name: Wait for k3s to be ready
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -uo pipefail
          echo "Polling k3s API — up to 30 attempts × 10s = 5 min..."
          for i in $(seq 1 30); do
            if sudo k3s kubectl get nodes &>/dev/null 2>&1; then
              echo "k3s API is up after $i attempts (~$((i*10))s)"
              sudo k3s kubectl get nodes
              exit 0
            fi
            echo "  attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "k3s API still not responding after 5 min"
          sudo journalctl -u k3s -n 30 --no-pager || true
          exit 1
          EOF

      - name: Verify etcd snapshot in S3
        if: ${{ steps.inputs.outputs.verify_snapshot == 'true' }}
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            'sudo k3s etcd-snapshot save --name post-rotation'
          sleep 15
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -euo pipefail
          source /etc/cloudless/aws-creds.env
          AWS_ACCESS_KEY_ID="${ETCD_S3_ACCESS_KEY}" \
          AWS_SECRET_ACCESS_KEY="${ETCD_S3_SECRET_KEY}" \
          AWS_DEFAULT_REGION=us-east-1 \
          aws s3 ls s3://cloudless-etcd-snapshots/etcd/ | tail -5
          EOF

      - name: Post result to status board
        if: always()
        uses: ./.github/actions/post-status

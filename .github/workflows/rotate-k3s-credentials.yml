name: rotate-k3s-credentials

# Operator-triggered k3s credential rotation for omv.
# After creating a new IAM key for omv-main-cli in AWS IAM, run this workflow
# to push the new credentials to omv and restart k3s — no SSH or local machine
# needed.
#
# Required repository secrets:
#   TS_OAUTH_CLIENT_ID  Tailscale OAuth client ID (from https://login.tailscale.com/admin/settings/oauth).
#   TS_OAUTH_SECRET    Tailscale OAuth client secret.
#   OMV_SSH_KEY   Private SSH key for tbaltzakis@omv (Tailscale IP).
#
# Pass the new key values as workflow inputs (they are masked in logs).
# The old key should be deactivated in IAM after verifying the next etcd
# snapshot lands in S3.
#
# Optional repository variables:
#   OMV_SSH_HOST  omv's Tailscale IP (default: 100.113.41.119)

on:
  workflow_dispatch:
    inputs:
      access_key_id:
        description: "New AWS access key ID for omv-main-cli (IAM)"
        type: string
        required: true
      secret_access_key:
        description: "New AWS secret access key for omv-main-cli"
        type: string
        required: true
      verify_snapshot:
        description: "After applying, force an etcd snapshot and verify it lands in S3."
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/dispatches/rotate-k3s-credentials.json]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/dispatches/rotate-k3s-credentials.json ]; then
            # Sensitive values must come from repo secrets when push-triggered
            access_key_id="${{ secrets.AWS_ACCESS_KEY_ID }}"
            secret_access_key="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            verify_snapshot=$(jq -r '.inputs.verify_snapshot // "false"' .github/dispatches/rotate-k3s-credentials.json)
          else
            access_key_id="${{ inputs.access_key_id }}"
            secret_access_key="${{ inputs.secret_access_key }}"
            verify_snapshot="${{ inputs.verify_snapshot || 'false' }}"
          fi
          echo "::add-mask::$secret_access_key"
          printf 'access_key_id=%s\nverify_snapshot=%s\n' "$access_key_id" "$verify_snapshot" >> "$GITHUB_OUTPUT"
          echo "secret_access_key=$secret_access_key" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          hostname: omv-k3s-rotate-ci

      - name: Configure SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OMV_SSH_KEY}" | tr -d '\r' > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          printf 'Host %s\n  IdentityFile ~/.ssh/omv_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "${OMV_SSH_HOST}" >> ~/.ssh/config

      - name: Apply new credentials on omv
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
          NEW_ACCESS_KEY_ID: ${{ steps.inputs.outputs.access_key_id }}
          NEW_SECRET_KEY: ${{ steps.inputs.outputs.secret_access_key }}
        run: |
          # base64-encode credentials so special characters survive shell quoting
          KEY_ID_B64="$(printf '%s' "${NEW_ACCESS_KEY_ID}" | base64 -w0)"
          SECRET_B64="$(printf '%s' "${NEW_SECRET_KEY}" | base64 -w0)"
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << EOF
          set -euo pipefail
          KEY_ID="\$(printf '%s' '${KEY_ID_B64}' | base64 -d)"
          SECRET="\$(printf '%s' '${SECRET_B64}' | base64 -d)"
          cd ~/OMV && git pull -q origin main
          sudo ETCD_S3_ACCESS_KEY="\${KEY_ID}" ETCD_S3_SECRET_KEY="\${SECRET}" \
            ./scripts/configure-k3s.sh
          sudo systemctl restart k3s
          EOF

      - name: Wait for k3s to be ready
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          echo "Waiting 30 s for k3s to restart..."
          sleep 30
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            'sudo k3s kubectl get nodes'

      - name: Verify etcd snapshot in S3
        if: ${{ steps.inputs.outputs.verify_snapshot == 'true' }}
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
          NEW_ACCESS_KEY_ID: ${{ steps.inputs.outputs.access_key_id }}
          NEW_SECRET_KEY: ${{ steps.inputs.outputs.secret_access_key }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            'sudo k3s etcd-snapshot save --name post-rotation'
          sleep 15
          AWS_ACCESS_KEY_ID="${NEW_ACCESS_KEY_ID}" \
          AWS_SECRET_ACCESS_KEY="${NEW_SECRET_KEY}" \
          AWS_DEFAULT_REGION=us-east-1 \
          aws s3 ls s3://cloudless-etcd-snapshots/etcd/ | tail -5

      - name: Post result to status board
        if: always()
        uses: ./.github/actions/post-status

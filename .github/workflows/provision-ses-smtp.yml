name: provision-ses-smtp

# Creates an IAM user keycloak-ses-smtp with SES send permission, derives the
# SES SMTP password, and writes a k3s secret keycloak-smtp in the keycloak
# namespace on omv — fixing Keycloak email verification.
#
# Required IAM: role cloudless-github-oidc (OIDC trust for Themis128/OMV)
#   iam:CreateUser/GetUser/PutUserPolicy/CreateAccessKey on keycloak-ses-smtp
#
# Required repository secrets:
#   TS_OAUTH_CLIENT_ID  Tailscale OAuth client ID.
#   TS_OAUTH_SECRET     Tailscale OAuth client secret.
#   OMV_SSH_KEY         Private SSH key for tbaltzakis@omv.
#
# Optional repository variables:
#   OMV_SSH_HOST        omv's Tailscale IP (default: 100.113.41.119).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/dispatches/provision-ses-smtp.json]

permissions:
  contents: read
  issues: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — check required secrets
        id: preflight
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
        run: |
          missing=()
          if [ -z "$TS_OAUTH_CLIENT_ID" ] && [ -z "$TS_AUTHKEY" ]; then
            missing+=(TS_OAUTH_CLIENT_ID)
          fi
          [ -z "$OMV_SSH_KEY" ] && missing+=(OMV_SSH_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required secrets: ${missing[*]}"
            echo "Set them in Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci
          hostname: omv-provision-ses-smtp-ci

      - name: Configure SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OMV_SSH_KEY}" | tr -d '\r' > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          printf 'Host %s\n  IdentityFile ~/.ssh/omv_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "${OMV_SSH_HOST}" >> ~/.ssh/config

      - name: Configure AWS credentials
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::278585680617:role/cloudless-github-oidc
          role-session-name: provision-ses-smtp
          aws-region: eu-west-1

      - name: Create SES SMTP user and credentials
        id: ses_user
        run: |
          set -euo pipefail

          USERNAME="keycloak-ses-smtp"
          REGION="eu-west-1"

          # --- Create IAM user (idempotent) ---
          if aws iam get-user --user-name "$USERNAME" >/dev/null 2>&1; then
            echo "IAM user $USERNAME already exists — skipping creation."
          else
            echo "Creating IAM user $USERNAME..."
            aws iam create-user --user-name "$USERNAME"
          fi

          # --- Attach inline policy allowing SES send ---
          echo "Attaching SES send policy to $USERNAME..."
          aws iam put-user-policy \
            --user-name "$USERNAME" \
            --policy-name "SESSendRawEmail" \
            --policy-document '{
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Action": ["ses:SendRawEmail"],
                "Resource": "*"
              }]
            }'

          # --- Create access key ---
          echo "Creating access key for $USERNAME..."
          KEY_JSON="$(aws iam create-access-key --user-name "$USERNAME")"
          KEY_ID="$(printf '%s' "$KEY_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['AccessKey']['AccessKeyId'])")"
          SECRET_KEY="$(printf '%s' "$KEY_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['AccessKey']['SecretAccessKey'])")"

          # --- Derive SES SMTP password (AWS4 signing for eu-west-1) ---
          SMTP_PASS="$(python3 - "$SECRET_KEY" "$REGION" <<'PYEOF'
          import sys, hmac, hashlib, base64
          secret_key = sys.argv[1]
          region     = sys.argv[2]
          def sign(key, msg):
              return hmac.new(key, msg.encode('utf-8'), hashlib.sha256).digest()
          secret = "AWS4" + secret_key
          date   = "11111111"
          k = sign(sign(sign(sign(secret.encode(), date), region), "ses"), "aws4_request")
          print(base64.b64encode(bytes([0x04]) + k).decode())
          PYEOF
          )"

          # --- Mask secrets in GHA logs ---
          echo "::add-mask::${KEY_ID}"
          echo "::add-mask::${SECRET_KEY}"
          echo "::add-mask::${SMTP_PASS}"

          echo "SMTP_USERNAME=${KEY_ID}" >> "$GITHUB_OUTPUT"
          echo "SMTP_PASSWORD=${SMTP_PASS}" >> "$GITHUB_OUTPUT"

          echo "SES SMTP credentials created successfully."

      - name: Create k3s secret on omv
        id: k3s_secret
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
          SMTP_USERNAME: ${{ steps.ses_user.outputs.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ steps.ses_user.outputs.SMTP_PASSWORD }}
        run: |
          set -euo pipefail

          USER_B64="$(printf '%s' "${SMTP_USERNAME}" | base64 -w0)"
          PASS_B64="$(printf '%s' "${SMTP_PASSWORD}" | base64 -w0)"

          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << EOF
          set -euo pipefail
          SMTP_USER="\$(printf '%s' '${USER_B64}' | base64 -d)"
          SMTP_PASS="\$(printf '%s' '${PASS_B64}' | base64 -d)"

          sudo k3s kubectl get namespace keycloak >/dev/null 2>&1 \\
            || sudo k3s kubectl create namespace keycloak

          sudo k3s kubectl create secret generic keycloak-smtp \\
            -n keycloak \\
            --from-literal=smtp-host=email-smtp.eu-west-1.amazonaws.com \\
            --from-literal=smtp-port=587 \\
            --from-literal=smtp-user="\${SMTP_USER}" \\
            --from-literal=smtp-password="\${SMTP_PASS}" \\
            --dry-run=client -o yaml \\
          | sudo k3s kubectl apply -f -

          echo "=== keycloak-smtp secret ==="
          sudo k3s kubectl get secret keycloak-smtp -n keycloak
          EOF

      - name: Post result to status board
        if: always()
        uses: ./.github/actions/post-status
        with:
          detail: >-
            preflight=${{ steps.preflight.outcome }}
            tailscale=${{ steps.tailscale.outcome }}
            aws_creds=${{ steps.aws_creds.outcome }}
            ses_user=${{ steps.ses_user.outcome }}
            k3s_secret=${{ steps.k3s_secret.outcome }}

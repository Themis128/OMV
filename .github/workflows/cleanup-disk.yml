name: cleanup-disk

# Free disk space on omv + omv-ha via SSH:
#   omv:
#     • docker system prune -af  (removes stopped containers, unused images, build cache)
#     • docker builder prune -af (clears BuildKit cache)
#     • Install docker-image-prune.timer (hourly dangling-image prune, idempotent)
#     • Fix logrotate rsyslog duplicate-entry error
#     • Reset stale failed systemd units (service-failure-alert, logrotate)
#     • Clear runner-work tmp dir on the USB drive
#   omv-ha (via ProxyJump through omv):
#     • k3s crictl rmi --prune (unused containerd images)
#     • docker prune if installed
#     • Reset failed units
#     • Install k3s-image-prune.timer (hourly containerd image prune, idempotent)
#
# Safe: does NOT remove running containers, named volumes, or k3s data.
#
# Required secrets: TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET (or TS_AUTHKEY), OMV_SSH_KEY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/dispatches/cleanup-disk.json]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci
          hostname: omv-cleanup-ci

      - name: Configure SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
          OMV_HA_SSH_HOST: ${{ vars.OMV_HA_SSH_HOST || '192.168.1.130' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OMV_SSH_KEY}" | tr -d '\r' > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          # omv (via Tailscale)
          printf 'Host %s\n  IdentityFile ~/.ssh/omv_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "${OMV_SSH_HOST}" >> ~/.ssh/config
          # omv-ha (via omv as jump host — local LAN only)
          printf 'Host omv-ha\n  HostName %s\n  User tbaltzakis\n  ProxyJump tbaltzakis@%s\n  IdentityFile ~/.ssh/omv_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "${OMV_HA_SSH_HOST}" "${OMV_SSH_HOST}" >> ~/.ssh/config

      - name: Disk usage before
        id: before
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          echo "=== Disk usage BEFORE cleanup ==="
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            "df -h /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7"

      - name: Docker prune
        id: docker
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -euo pipefail
          echo "=== Docker system prune (containers, images, networks, build cache) ==="
          sudo docker system prune -af
          echo "=== Docker builder prune (BuildKit cache) ==="
          sudo docker builder prune -af || true
          echo "=== Docker disk usage after ==="
          sudo docker system df
          EOF

      - name: Install hourly docker-image-prune timer
        id: timer
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -euo pipefail

          printf '[Unit]\nDescription=Prune dangling Docker images\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/docker image prune -f\nStandardOutput=journal\n' \
            | sudo tee /etc/systemd/system/docker-image-prune.service > /dev/null

          printf '[Unit]\nDescription=Hourly Docker image prune\nAfter=docker.service\n\n[Timer]\nOnCalendar=hourly\nPersistent=true\n\n[Install]\nWantedBy=timers.target\n' \
            | sudo tee /etc/systemd/system/docker-image-prune.timer > /dev/null

          sudo systemctl daemon-reload
          sudo systemctl enable --now docker-image-prune.timer
          echo "=== Timer status ==="
          sudo systemctl list-timers docker-image-prune.timer --no-pager
          EOF

      - name: Fix logrotate + reset failed units
        id: fixes
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -euo pipefail

          # Fix rsyslog logrotate duplicate — remove the duplicate /var/log/syslog line
          if sudo logrotate --debug /etc/logrotate.conf 2>&1 | grep -q 'duplicate log entry'; then
            echo "Fixing duplicate syslog entry in /etc/logrotate.d/rsyslog ..."
            sudo awk '
              /\/var\/log\/syslog/ { if (seen) next; seen=1 }
              { print }
            ' /etc/logrotate.d/rsyslog | sudo tee /etc/logrotate.d/rsyslog.tmp > /dev/null
            sudo mv /etc/logrotate.d/rsyslog.tmp /etc/logrotate.d/rsyslog
            echo "Testing logrotate config ..."
            sudo logrotate --debug /etc/logrotate.conf 2>&1 | grep -i error || echo "No errors."
          else
            echo "logrotate config OK — no fix needed."
          fi

          # Reset stale failed units
          echo "=== Resetting failed units ==="
          sudo systemctl reset-failed service-failure-alert@k3s.service.service 2>/dev/null || true
          sudo systemctl reset-failed logrotate.service 2>/dev/null || true
          sudo systemctl --failed --no-pager --no-legend || echo "(no failed units)"

          # Clear runner-work tmp on USB drive
          echo "=== Clearing runner-work tmp ==="
          RWORK=/srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7/runner-work
          [ -d "$RWORK" ] && sudo rm -rf "${RWORK:?}"/* && echo "Cleared $RWORK" || true
          EOF

      - name: omv-ha — cleanup images + reset failed units
        id: ha_cleanup
        run: |
          ssh omv-ha bash -s << 'EOF'
          set -euo pipefail

          echo "=== k3s crictl image prune (unused containerd images) ==="
          sudo k3s crictl rmi --prune 2>/dev/null || true

          echo "=== Docker prune (if installed) ==="
          if command -v docker >/dev/null 2>&1; then
            sudo docker system prune -af || true
            sudo docker builder prune -af || true
          else
            echo "(docker not installed on omv-ha — skipped)"
          fi

          echo "=== Resetting failed units ==="
          sudo systemctl reset-failed 2>/dev/null || true
          sudo systemctl --failed --no-pager --no-legend || echo "(no failed units)"

          echo "=== Disk usage ==="
          df -h / /var/lib/rancher/k3s 2>/dev/null || df -h /
          EOF

      - name: omv-ha — install hourly k3s-image-prune timer
        id: ha_timer
        run: |
          ssh omv-ha bash -s << 'EOF'
          set -euo pipefail

          printf '[Unit]\nDescription=Prune unused k3s containerd images\n\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/k3s crictl rmi --prune\nStandardOutput=journal\n' \
            | sudo tee /etc/systemd/system/k3s-image-prune.service > /dev/null

          printf '[Unit]\nDescription=Hourly k3s image prune\nAfter=k3s-agent.service\n\n[Timer]\nOnCalendar=hourly\nPersistent=true\n\n[Install]\nWantedBy=timers.target\n' \
            | sudo tee /etc/systemd/system/k3s-image-prune.timer > /dev/null

          sudo systemctl daemon-reload
          sudo systemctl enable --now k3s-image-prune.timer
          echo "=== Timer status ==="
          sudo systemctl list-timers k3s-image-prune.timer --no-pager
          EOF

      - name: Disk usage after
        id: after
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          echo "=== Disk usage AFTER cleanup ==="
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            "df -h /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7"

      - name: Post result to status board
        if: always()
        uses: ./.github/actions/post-status
        with:
          detail: >-
            tailscale=${{ steps.tailscale.outcome }}
            docker=${{ steps.docker.outcome }}
            timer=${{ steps.timer.outcome }}
            fixes=${{ steps.fixes.outcome }}
            ha_cleanup=${{ steps.ha_cleanup.outcome }}
            ha_timer=${{ steps.ha_timer.outcome }}

name: setup-tailscale-oauth

# Store Tailscale OAuth credentials as GitHub repo secrets.
#
# Modes (auto-selected based on what's available):
#   1. TS_API_KEY repo secret exists → creates a new OAuth client automatically
#      (add it once at Settings → Secrets, then trigger via dispatch file)
#   2. workflow_dispatch with mode=existing → paste client ID + secret directly
#   3. workflow_dispatch with mode=create + tailscale_api_key input → create new client
#
# After storing, all workflows use OAuth instead of the deprecated TS_AUTHKEY.
# Triggered automatically via .github/dispatches/setup-tailscale-oauth.json push.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Use existing credentials or create a new OAuth client."
        type: choice
        options: [existing, create]
        default: existing
      oauth_client_id:
        description: "[existing] OAuth client ID."
        type: string
        required: false
      oauth_secret:
        description: "[existing] OAuth client secret."
        type: string
        required: false
      tailscale_api_key:
        description: "[create] Tailscale API key — leave blank to use TS_API_KEY secret."
        type: string
        required: false
      delete_old_authkey:
        description: "Delete the old TS_AUTHKEY secret."
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [.github/dispatches/setup-tailscale-oauth.json]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PyNaCl
        run: pip install --quiet PyNaCl requests

      - name: Store Tailscale OAuth secrets
        env:
          MODE: ${{ inputs.mode || 'create' }}
          OAUTH_CLIENT_ID: ${{ inputs.oauth_client_id }}
          OAUTH_SECRET: ${{ inputs.oauth_secret }}
          TS_API_KEY_INPUT: ${{ inputs.tailscale_api_key }}
          TS_API_KEY_SECRET: ${{ secrets.TS_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          DELETE_OLD: ${{ inputs.delete_old_authkey || 'true' }}
        run: |
          python3 << 'PYEOF'
          import os, base64, requests
          from nacl import encoding, public

          mode       = os.environ["MODE"]
          gh_token   = os.environ["GH_TOKEN"]
          repo       = os.environ["REPO"]
          delete_old = os.environ["DELETE_OLD"].lower() == "true"

          if mode == "existing":
              client_id     = os.environ["OAUTH_CLIENT_ID"].strip()
              client_secret = os.environ["OAUTH_SECRET"].strip()
              if not client_id or not client_secret:
                  raise SystemExit("ERROR: oauth_client_id and oauth_secret required in 'existing' mode.")
              print(f"Using existing OAuth client: {client_id[:8]}…")
          else:
              # prefer explicit input, fall back to TS_API_KEY repo secret
              ts_api_key = (os.environ.get("TS_API_KEY_INPUT") or "").strip() or \
                           (os.environ.get("TS_API_KEY_SECRET") or "").strip()
              if not ts_api_key:
                  raise SystemExit(
                      "ERROR: no Tailscale API key found.\n"
                      "Add TS_API_KEY as a repo secret, or pass tailscale_api_key as a workflow input."
                  )
              print("Creating new Tailscale OAuth client…")
              resp = requests.post(
                  "https://api.tailscale.com/api/v2/oauth/clients",
                  auth=(ts_api_key, ""),
                  json={
                      "description": "GitHub Actions — OMV workflows",
                      "scopes": ["devices:write"],
                  },
              )
              resp.raise_for_status()
              data          = resp.json()
              client_id     = data["id"]
              client_secret = data["secret"]
              print(f"OAuth client created: {client_id}")

          # Get repo public key for secret encryption
          gh_api  = f"https://api.github.com/repos/{repo}/actions/secrets"
          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          pk      = requests.get(f"{gh_api}/public-key", headers=headers)
          pk.raise_for_status()
          pk_data = pk.json()
          key_id  = pk_data["key_id"]
          pub_key = public.PublicKey(pk_data["key"].encode(), encoding.Base64Encoder)

          def store(name, value):
              box       = public.SealedBox(pub_key)
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              r = requests.put(
                  f"{gh_api}/{name}",
                  headers=headers,
                  json={"encrypted_value": encrypted, "key_id": key_id},
              )
              r.raise_for_status()
              print(f"Stored {name} ({r.status_code})")

          store("TS_OAUTH_CLIENT_ID", client_id)
          store("TS_OAUTH_SECRET",    client_secret)

          if delete_old:
              r = requests.delete(f"{gh_api}/TS_AUTHKEY", headers=headers)
              if r.status_code == 404:
                  print("TS_AUTHKEY not found (already deleted)")
              else:
                  r.raise_for_status()
                  print(f"Deleted TS_AUTHKEY ({r.status_code})")

          print("Done. Workflows will now use OAuth authentication.")
          PYEOF

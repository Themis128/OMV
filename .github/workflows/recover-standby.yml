name: recover-standby

# Operator-triggered cluster recovery. Joins the Tailscale tailnet from a
# GitHub-hosted runner, then SSHes into omv and runs
# scripts/recover-standby.sh — so the cloudless.gr cluster can be
# recovered straight from the GitHub UI (phone included) with no local
# SSH access, laptop, or pre-installed self-hosted runner.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   TS_AUTHKEY    Tailscale auth key (reusable; ephemeral recommended).
#                 Tailscale admin → Settings → Keys → Generate auth key.
#
#   OMV_SSH_KEY   Private SSH key whose public half is in omv's
#                 ~/.ssh/authorized_keys for user tbaltzakis.
#                 Same key used by the omv-report workflow.
#
# Optional repository variables:
#   OMV_SSH_HOST  omv's Tailscale IP (default: 100.113.41.119).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply fixes (restart services / roll cloudless-app). Off = diagnose only."
        type: boolean
        default: true
      etcd_recover:
        description: "Run etcd cluster-reset (use when etcd lost quorum and omv loops 'pre-candidate')."
        type: boolean
        default: false
      omv_ha_prep:
        description: "Apply memory tunes on omv-ha (zram, OOM-protect k3s, journal cap). Safe to re-run."
        type: boolean
        default: false
      node_cleanup:
        description: "Run disk cleanup on omv (prune containerd images, vacuum journal, trim etcd snapshots to 3)."
        type: boolean
        default: false
      k3s_restart:
        description: "Restart k3s on omv if its API is down (bypasses site health probe). Use when apply-cluster-manifests fails with 'k3s API not ready'."
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/dispatches/recover-standby.json]

permissions:
  contents: read

env:
  OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse inputs
        id: parse_inputs
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            apply=$(jq -r '.inputs.apply // false'              .github/dispatches/recover-standby.json)
            etcd_recover=$(jq -r '.inputs.etcd_recover // false' .github/dispatches/recover-standby.json)
            omv_ha_prep=$(jq -r '.inputs.omv_ha_prep // false'   .github/dispatches/recover-standby.json)
            node_cleanup=$(jq -r '.inputs.node_cleanup // false'  .github/dispatches/recover-standby.json)
            k3s_restart=$(jq -r '.inputs.k3s_restart // false'    .github/dispatches/recover-standby.json)
          else
            apply="${{ inputs.apply }}"
            etcd_recover="${{ inputs.etcd_recover }}"
            omv_ha_prep="${{ inputs.omv_ha_prep }}"
            node_cleanup="${{ inputs.node_cleanup }}"
            k3s_restart="${{ inputs.k3s_restart }}"
          fi
          echo "apply=$apply"               >> "$GITHUB_OUTPUT"
          echo "etcd_recover=$etcd_recover" >> "$GITHUB_OUTPUT"
          echo "omv_ha_prep=$omv_ha_prep"   >> "$GITHUB_OUTPUT"
          echo "node_cleanup=$node_cleanup" >> "$GITHUB_OUTPUT"
          echo "k3s_restart=$k3s_restart"   >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: omv-recovery-ci

      - name: Configure SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OMV_SSH_KEY}" | tr -d '\r' > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          printf 'Host %s\n  IdentityFile ~/.ssh/omv_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "${OMV_SSH_HOST}" >> ~/.ssh/config

      # ── k3s_restart steps (split for visibility) ──────────────────────────

      - name: k3s restart — diagnose + disk state
        if: ${{ steps.parse_inputs.outputs.k3s_restart == 'true' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -uo pipefail
          echo "=== k3s service state ==="
          systemctl is-active k3s 2>/dev/null || true
          systemctl status k3s --no-pager -l 2>/dev/null | tail -20 || true

          echo "=== Disk usage ==="
          for d in /srv/dev-disk-by-uuid-*; do [ -d "$d" ] && df -h "$d"; done || df -h /
          EOF

      - name: k3s restart — stop + clean disk
        if: ${{ steps.parse_inputs.outputs.k3s_restart == 'true' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -uo pipefail
          echo "=== Masking k3s to stop restart loop ==="
          sudo systemctl mask k3s 2>/dev/null || true
          sudo systemctl stop k3s 2>/dev/null || true
          sleep 3

          echo "=== Cleaning stale etcd-tmp directories ==="
          sudo find /srv -name 'etcd-tmp' -type d 2>/dev/null -exec rm -rf {} + 2>/dev/null || true
          sudo find /var/lib/rancher -name 'etcd-tmp' -type d 2>/dev/null -exec rm -rf {} + 2>/dev/null || true
          echo "etcd-tmp cleaned"

          echo "=== Trimming etcd snapshots to 3 most recent ==="
          for snap_dir in /srv/dev-disk-by-uuid-*/k3s/server/db/snapshots \
                          /var/lib/rancher/k3s/server/db/snapshots; do
            [ -d "$snap_dir" ] || continue
            count=$(ls -1 "$snap_dir" 2>/dev/null | wc -l)
            echo "  $snap_dir: $count snapshots"
            ls -1t "$snap_dir" | tail -n +4 | xargs -r -I{} sudo rm -v "$snap_dir/{}"
          done

          echo "=== Pruning k3s container images (timeout 90s) ==="
          timeout 90 sudo k3s crictl rmi --prune 2>/dev/null || echo "crictl prune skipped/timed out"

          echo "=== Pruning Docker images and containers ==="
          sudo docker system prune -af 2>/dev/null || true
          sudo rm -rf /srv/dev-disk-by-uuid-*/docker-cache/ 2>/dev/null || true

          echo "=== Disk usage after cleanup ==="
          for d in /srv/dev-disk-by-uuid-*; do [ -d "$d" ] && df -h "$d"; done || df -h /
          EOF

      - name: k3s restart — start k3s
        if: ${{ steps.parse_inputs.outputs.k3s_restart == 'true' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -uo pipefail
          echo "=== Unmasking and starting k3s ==="
          sudo systemctl unmask k3s 2>/dev/null || true
          sudo systemctl reset-failed k3s 2>/dev/null || true
          sudo systemctl start k3s
          echo "k3s start command issued"
          EOF

      - name: k3s restart — wait for API (up to 5 min)
        if: ${{ steps.parse_inputs.outputs.k3s_restart == 'true' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -uo pipefail
          echo "Polling k3s API — up to 30 attempts × 10s = 5 min..."
          for i in $(seq 1 30); do
            if sudo k3s kubectl get nodes &>/dev/null 2>&1; then
              echo "k3s API is up after $i attempts (~$((i*10))s)"
              sudo k3s kubectl get nodes
              sudo k3s kubectl get pods -A | head -30
              exit 0
            fi
            echo "  attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "k3s API still not responding after 5 min — check journal below"
          exit 1
          EOF

      - name: k3s restart — journal (last 60 lines)
        if: ${{ steps.parse_inputs.outputs.k3s_restart == 'true' && always() }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            'sudo journalctl -u k3s -n 60 --no-pager' || true

      # ── end k3s_restart steps ─────────────────────────────────────────────

      - name: Recover standby
        if: ${{ steps.parse_inputs.outputs.apply == 'true' }}
        env:
          OMV_HOST: "tbaltzakis@${{ vars.OMV_SSH_HOST || '100.113.41.119' }}"
        run: |
          ./scripts/recover-standby.sh --yes

      - name: etcd cluster-reset (quorum lost)
        if: ${{ steps.parse_inputs.outputs.etcd_recover == 'true' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            'sudo REJOIN=1 ~/OMV/scripts/etcd-recover.sh'

      - name: Node cleanup (prune images, vacuum journal, trim etcd snapshots)
        if: ${{ steps.parse_inputs.outputs.node_cleanup == 'true' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -euo pipefail
          echo "=== Prune unused containerd images ==="
          sudo k3s crictl rmi --prune || true
          echo "=== Vacuum systemd journal (keep 7 days) ==="
          sudo journalctl --vacuum-time=7d
          echo "=== Trim etcd snapshots to 3 most recent ==="
          for snap_dir in /srv/dev-disk-by-uuid-*/k3s/server/db/snapshots \
                          /var/lib/rancher/k3s/server/db/snapshots; do
            [ -d "$snap_dir" ] || continue
            ls -1t "$snap_dir" | tail -n +4 | xargs -r -I{} sudo rm -v "$snap_dir/{}"
            echo "Snapshots remaining in $snap_dir: $(ls "$snap_dir" | wc -l)"
          done
          echo "=== Disk usage after cleanup ==="
          df -h /
          for d in /srv/dev-disk-by-uuid-*; do [ -d "$d" ] && df -h "$d"; done || true
          EOF

      - name: omv-ha memory tunes (zram + OOM protection)
        if: ${{ steps.parse_inputs.outputs.omv_ha_prep == 'true' }}
        env:
          OMV_HA_HOST: ${{ vars.OMV_HA_HOST || '192.168.1.130' }}
        run: |
          # shellcheck disable=SC2029
          ssh "tbaltzakis@${OMV_SSH_HOST}" \
            "ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
              tbaltzakis@${OMV_HA_HOST} \
              'cd ~/OMV && git pull -q origin main && sudo ./scripts/omv-ha-k3s-prep.sh --apply'"

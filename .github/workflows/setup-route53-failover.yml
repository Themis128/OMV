name: setup-route53-failover

# Operator-triggered Route 53 failover setup for cloudless.gr (Phase 2).
# Runs setup-route53-failover.sh directly from a GitHub-hosted runner using
# AWS credentials stored as repository secrets — no local machine needed.
#
# Required repository secrets:
#   AWS_ACCESS_KEY_ID      Access key for an IAM principal with Route 53 write
#                          access on the cloudless.gr hosted zone.
#   AWS_SECRET_ACCESS_KEY  Corresponding secret key.
#
# Optional repository variables:
#   R53_ZONE_ID    Hosted zone ID (default: Z079608614L53CC4EAZM3)
#   R53_DOMAIN     Domain name   (default: cloudless.gr)
#   PI_WAN_IP      Pi WAN IP     (default: 150.228.63.192)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only — print what would happen, make no changes."
        type: boolean
        default: true
      pi_wan_ip:
        description: "Pi WAN IP for SECONDARY record (leave blank to use repo variable / default)."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  route53-failover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run setup-route53-failover.sh
        env:
          ZONE_ID:    ${{ vars.R53_ZONE_ID  || 'Z079608614L53CC4EAZM3' }}
          DOMAIN:     ${{ vars.R53_DOMAIN   || 'cloudless.gr' }}
          PI_WAN_IP:  ${{ inputs.pi_wan_ip != '' && inputs.pi_wan_ip || vars.PI_WAN_IP || '150.228.63.192' }}
          # aws-actions/configure-aws-credentials sets the env vars already;
          # override the profile so the script doesn't try to use a named profile.
          AWS_PROFILE: ""
        run: |
          chmod +x scripts/setup-route53-failover.sh
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ./scripts/setup-route53-failover.sh --dry-run
          else
            ./scripts/setup-route53-failover.sh
          fi

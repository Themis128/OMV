name: cleanup-keycloak

# Deletes the keycloak namespace from the k3s cluster (one-shot cleanup).
# Keycloak is no longer used — the app migrated to AWS Cognito.
#
# Trigger: update triggered_at in .github/dispatches/cleanup-keycloak.json

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/dispatches/cleanup-keycloak.json

permissions:
  id-token: write
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: omv-keycloak-cleanup-ci

      - name: Configure SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OMV_SSH_KEY}" | tr -d '\r' > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          printf 'Host %s\n  IdentityFile ~/.ssh/omv_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "${OMV_SSH_HOST}" >> ~/.ssh/config

      - name: Delete keycloak namespace
        id: delete
        env:
          OMV_SSH_HOST: ${{ vars.OMV_SSH_HOST || '100.113.41.119' }}
        run: |
          ssh "tbaltzakis@${OMV_SSH_HOST}" bash -s << 'EOF'
          set -euo pipefail
          sudo k3s kubectl delete namespace keycloak --ignore-not-found
          echo "Remaining namespaces:"
          sudo k3s kubectl get namespaces
          EOF

      - name: Post result to status board
        if: always()
        uses: ./.github/actions/post-status
        with:
          detail: "keycloak-cleanup=${{ steps.delete.outcome }}"
          token: ${{ secrets.GH_PAT }}

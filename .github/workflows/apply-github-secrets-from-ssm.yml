name: apply-github-secrets-from-ssm

# One-shot: reads AWS credentials from SSM Parameter Store via OIDC and
# writes them as GitHub repo secrets. workflow_dispatch only — the
# secrets+id-token permission combo is blocked on push events.

on:
  workflow_dispatch:

permissions:
  contents: read
  secrets: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::278585680617:role/cloudless-github-oidc
          role-session-name: apply-github-secrets-from-ssm
          aws-region: us-east-1

      - name: Read SSM and set GitHub secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          KEY_ID="$(aws ssm get-parameter \
            --name /sst/cloudless/github/AWS_ACCESS_KEY_ID \
            --with-decryption --query 'Parameter.Value' --output text)"
          SECRET="$(aws ssm get-parameter \
            --name /sst/cloudless/github/AWS_SECRET_ACCESS_KEY \
            --with-decryption --query 'Parameter.Value' --output text)"
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$SECRET"
          gh secret set AWS_ACCESS_KEY_ID --body "$KEY_ID"
          gh secret set AWS_SECRET_ACCESS_KEY --body "$SECRET"
          echo "Done — AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY set as repo secrets."

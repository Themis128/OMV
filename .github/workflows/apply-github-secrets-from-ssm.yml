name: apply-github-secrets-from-ssm
# Reads AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY from SSM Parameter Store
# (/sst/cloudless/github/*) via OIDC and writes them as GitHub repo secrets.
#
# Prerequisites:
#   1. IAM role cloudless-github-oidc trust policy must include repo:Themis128/OMV:*
#   2. SSM params must exist:
#        /sst/cloudless/github/AWS_ACCESS_KEY_ID   (String)
#        /sst/cloudless/github/AWS_SECRET_ACCESS_KEY (SecureString)
#
# Trigger: update triggered_at in .github/dispatches/apply-github-secrets-from-ssm.json
# or run manually via Actions tab -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/dispatches/apply-github-secrets-from-ssm.json

permissions:
  id-token: write   # OIDC token for AWS
  contents: read
  issues: write     # post status comment to issue #66

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AWS_REGION: us-east-1
  SSM_PREFIX: /sst/cloudless/github

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::278585680617:role/cloudless-github-oidc
          aws-region: ${{ env.AWS_REGION }}

      - name: Read AWS credentials from SSM
        id: ssm
        run: |
          KEY_ID=$(aws ssm get-parameter \
            --name "${SSM_PREFIX}/AWS_ACCESS_KEY_ID" \
            --query 'Parameter.Value' --output text)
          SECRET=$(aws ssm get-parameter \
            --name "${SSM_PREFIX}/AWS_SECRET_ACCESS_KEY" \
            --with-decryption \
            --query 'Parameter.Value' --output text)

          # Mask both values before any further output
          echo "::add-mask::${KEY_ID}"
          echo "::add-mask::${SECRET}"

          echo "key_id=${KEY_ID}" >> "$GITHUB_OUTPUT"
          echo "secret=${SECRET}" >> "$GITHUB_OUTPUT"

      - name: Install PyNaCl
        run: pip install --quiet PyNaCl requests

      - name: Store credentials as GitHub repo secrets
        env:
          AWS_ACCESS_KEY_ID_VAL: ${{ steps.ssm.outputs.key_id }}
          AWS_SECRET_ACCESS_KEY_VAL: ${{ steps.ssm.outputs.secret }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, base64, requests
          from nacl import encoding, public

          key_id_val = os.environ["AWS_ACCESS_KEY_ID_VAL"].strip()
          secret_val = os.environ["AWS_SECRET_ACCESS_KEY_VAL"].strip()
          gh_token   = os.environ["GH_TOKEN"]
          repo       = os.environ["REPO"]

          if not key_id_val or not secret_val:
              raise SystemExit("ERROR: SSM parameters are empty.")

          gh_api  = f"https://api.github.com/repos/{repo}/actions/secrets"
          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          pk      = requests.get(f"{gh_api}/public-key", headers=headers)
          pk.raise_for_status()
          pk_data = pk.json()
          repo_key_id = pk_data["key_id"]
          pub_key = public.PublicKey(pk_data["key"].encode(), encoding.Base64Encoder)

          def store(name, value):
              box       = public.SealedBox(pub_key)
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              r = requests.put(
                  f"{gh_api}/{name}",
                  headers=headers,
                  json={"encrypted_value": encrypted, "key_id": repo_key_id},
              )
              r.raise_for_status()
              print(f"Stored {name} ({r.status_code})")

          store("AWS_ACCESS_KEY_ID",     key_id_val)
          store("AWS_SECRET_ACCESS_KEY", secret_val)
          print(f"Done. Key ID prefix: {key_id_val[:8]}...")
          PYEOF

      - name: Post result to status board
        if: always()
        uses: ./.github/actions/post-status
        with:
          detail: "ssm=${{ steps.ssm.outcome }}"

name: Post to Workflow Status Board
description: Posts a pass/fail comment to the status board issue (issue #66).

inputs:
  detail:
    description: "Optional extra line appended to the comment body."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Post comment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        STATUS: ${{ job.status }}
        DETAIL: ${{ inputs.detail }}
        WORKFLOW: ${{ github.workflow }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ "$STATUS" = "success" ]; then icon="✅"; else icon="❌"; fi
        body="$(printf '%s\nTriggered: `%s` → `%s`\nRun: %s\nAt: %s' \
          "${icon} **${WORKFLOW}** — ${STATUS}" \
          "${EVENT}" "${REF}" \
          "${RUN_URL}" \
          "$(date -u '+%Y-%m-%d %H:%M UTC')")"
        [ -n "$DETAIL" ] && body="${body}"$'\n'"${DETAIL}"
        gh api "repos/${{ github.repository }}/issues/66/comments" -f body="$body"

name: Post to Workflow Status Board
description: Posts a pass/fail comment to the status board issue (issue #66).

inputs:
  detail:
    description: "Optional extra line appended to the comment body."
    required: false
    default: ""
  token:
    description: "GitHub token to use (defaults to github.token)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Post comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        STATUS: ${{ job.status }}
        DETAIL: ${{ inputs.detail }}
        WF: ${{ github.workflow }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ "$STATUS" = "success" ]; then icon="✅"; else icon="❌"; fi
        ts=$(date -u '+%Y-%m-%d %H:%M UTC')
        body="${icon} **${WF}** — ${STATUS}"$'\n'"Triggered: \`${EVENT}\` → \`${REF}\`"$'\n'"Run: ${RUN_URL}"$'\n'"At: ${ts}"
        [ -n "$DETAIL" ] && body="${body}"$'\n'"${DETAIL}"
        gh api "repos/${{ github.repository }}/issues/66/comments" -f body="$body"
